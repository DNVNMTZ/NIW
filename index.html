    }, 'Categoría eliminada');
  },
  /* Dashboard, calendario y franja semanal */
  safeDetail: () => {
    const sf = Calc.safe();
    const list = (arr, sign) => arr.map(x => '<div class="row sub"><span class="lbl">· ' + esc(x.name) + (x.date ? ' <span class="tiny">(' + fmtDateS(x.date) + (x.overdue ? ', vencido' : '') + ')</span>' : '') + (x.detail ? ' <span class="tiny">' + esc(x.detail) + '</span>' : '') + '</span><span class="num">' + money(sign * x.amount) + '</span></div>').join('');
    Modal.info('¿Cómo se calcula el Disponible seguro?', '<p class="small muted" style="margin-top:0">Cuánto puedes gastar hoy sin comprometer tus próximos pagos, deudas, metas y presupuesto, hasta tu próximo ingreso (' + fmtDateL(sf.nextPayday) + ').</p><div class="rows">' +
      row('Disponible real (ya cobrado − ya pagado)', money(sf.liquid)) +
      row('Compromisos hasta el ' + fmtDateS(addDays(sf.nextPayday, -1)), money(-sf.totalCommit)) + list(sf.commitments, -1) +
      row('Apartados acumulados', money(-sf.totalApart)) + list(sf.apartados, -1) +
      row('Ahorro comprometido de la quincena', money(-sf.totalSave)) + list(sf.savings, -1) +
      row('DISPONIBLE SEGURO', '<span class="' + (sf.safe < 0 ? 'neg' : 'pos') + '">' + money(sf.safe) + '</span>', 'total') +
      row('Por día (' + sf.daysLeft + ' días)', money(sf.perDay)) + '</div>' + ((sf.pendIn || sf.pendOut) ? '<p class="small muted">Registrado sin confirmar: por cobrar ' + money(sf.pendIn) + ' (no se suma hasta que lo confirmes) · por pagar ' + money(sf.pendOut) + ' · proyectado ' + money(sf.projected) + '.</p>' : '') + (sf.period.start < D().settings.startDate ? '<p class="small muted">Los abonos a deudas y ahorros planeados empiezan con la quincena del ' + fmtDate(Calc.planningStart()) + '.</p>' : ''), true);
  },
  confirmMov: ds => { const m = D().movements.find(x => x.id === ds.id); if (!m) return; withUndo(() => { m.status = 'realizado'; }, (Calc.liquidEffect(m) > 0 ? 'Cobro' : 'Pago') + ' confirmado: ya cuenta en tu disponible real'); },
  pendMov: ds => { const m = D().movements.find(x => x.id === ds.id); if (!m) return; withUndo(() => { m.status = 'pendiente'; }, 'Marcado como pendiente: no cuenta en tu disponible real'); },
  toggleToday: () => { ui.todayOpen = !ui.todayOpen; App.render(); },
  dashWeekNav: ds => { ui.dashWeek = addDays(ui.dashWeek || Calc.weekStartOf(today()), 7 * Number(ds.dir)); ui.dashMonth = addDays(ui.dashWeek, 3).slice(0, 7); ui.dashScope = 'semana'; App.render(); },
  dashScope: ds => { ui.dashScope = ['semana', 'mes'].includes(ds.scope) ? ds.scope : 'total'; App.render(); },
  dashToday: () => { ui.dashWeek = Calc.weekStartOf(today()); ui.dashMonth = today().slice(0, 7); ui.dashScope = 'total'; App.render(); },
  dashCal: ds => { ui.dashCal = ds.mode === 'mes' ? 'mes' : 'semana'; App.render(); },
  dayDetail: ds => { if (isDate(ds.date)) Modal.info('Detalle del día', dayDetailHtml(ds.date), true); },
  showAlerts: () => { if (!Calc.alerts().length && Bank.pending().length) return Nav.go('bandeja'); if (ui.section !== 'dashboard') Nav.go('dashboard'); const c = $('alertsCard'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
  flowNav: ds => { const dir = Number(ds.dir); if (dir === 0) ui.flowStart = Calc.planningStart(); else if (dir > 0) ui.flowStart = addDays(Calc.periodOf(ui.flowStart).end, 1); else ui.flowStart = Calc.periodOf(addDays(ui.flowStart, -1)).start; App.render(); },
  weekNav: ds => { const dir = Number(ds.dir); ui.weekStart = dir === 0 ? Calc.weekStartOf(today()) : addDays(ui.weekStart || Calc.weekStartOf(today()), 7 * dir); App.render(); },
  resMonthNav: ds => { ui.resMonth = addMonthsStart((ui.resMonth || today().slice(0, 7)) + '-01', Number(ds.dir)).slice(0, 7); App.render(); },
  calNav: ds => { const dir = Number(ds.dir); if (dir === 0) { ui.calMonth = monthStart(today()); ui.calSel = today(); } else { ui.calMonth = addMonthsStart(ui.calMonth || monthStart(today()), dir); ui.calSel = ui.calMonth; } App.render(); },
  calSelect: ds => { ui.calSel = ds.date; if (ds.date.slice(0, 7) !== ui.calMonth.slice(0, 7)) ui.calMonth = monthStart(ds.date); App.render(); },
  /* Registro rápido */
  quickAdd: () => {
    const opt = (ic, label, sub, action, data) => '<button type="button" class="sheet-opt" data-action="' + action + '"' + Object.keys(data || {}).map(k => ' data-' + k + '="' + esc(data[k]) + '"').join('') + '><span class="t-ic">' + icon(ic) + '</span><b>' + label + '</b><span>' + sub + '</span></button>';
    Modal.info('¿Qué quieres registrar?', '<div class="sheet-grid">' +
      opt('food', 'Comida', 'Gasto del día a día', 'newFood') + opt('card', 'Otro gasto', 'Con categoría y cuenta', 'newMovement') +
      opt('inbox', 'Cargo del banco', 'Pega el aviso de tu tarjeta', 'pasteCharge') + opt('cal', 'Pago programado', 'Renta, servicios, viaje…', 'goto', { target: 'presupuesto' }) +
      opt('down', 'Cobro de nómina', 'Ingreso de la quincena', 'newIncomeQ') + opt('spark', 'Ingreso extra', 'Bono, comisión, devolución', 'newIncomeExtra') +
      opt('flag', 'Aportar a una meta', 'Ahorro para viaje u otra', 'goto', { target: 'metas' }) + opt('repeat', 'Transferencia', 'Entre tus cuentas', 'newTransfer') + opt('cash', 'Retiro de efectivo', 'Cajero o disposición con tarjeta', 'newCash') + '</div>', true);
  },
  newTransfer: () => Forms.movement(null, { _title: 'Transferencia entre cuentas', type: 'transferencia', description: 'Transferencia', method: 'Transferencia' }),
  /* Bandeja de cargos */
  pasteCharge: () => Forms.pasteCharge(),
  mailSetup: () => Forms.mailSetup(),
  syncMail: async () => { const r = await Bank.sync(false); if (r) App.render(); },
  downloadScript: () => { if (download('niw_lector_gmail.gs', APPS_SCRIPT, 'text/plain;charset=utf-8')) Toast.show('Script descargado', 'ok'); },
  showScript: () => Modal.info('Script para Gmail (Apps Script)', '<p class="small muted" style="margin-top:0">Cópialo en script.google.com con la cuenta donde recibes los avisos de tu banco.</p><div class="code">' + esc(APPS_SCRIPT) + '</div><div class="actions mt">' + btn(icon('down') + 'Descargar', 'downloadScript', {}, 'sm primary') + '</div>', true),
  inboxCategorize: ds => { const it = (D().inbox || []).find(x => x.id === ds.id); if (it) Forms.inboxItem(it); },
  inboxAccept: ds => {
    const it = (D().inbox || []).find(x => x.id === ds.id); if (!it) return;
    const sg = Bank.suggest(it); if (!sg) return Forms.inboxItem(it);
    const rule = Bank.rule(it.key);
    withUndo(() => Bank.post(it, { category: sg.category, kind: sg.kind || 'esporadica', recurringId: sg.recurringId, payWith: Bank.payWithDefault(it), remember: true, auto: rule ? rule.auto : false, name: rule ? rule.merchant : it.merchant }), it.merchant + ' → ' + sg.category);
  },
  inboxDiscard: ds => { const it = (D().inbox || []).find(x => x.id === ds.id); if (!it) return; withUndo(() => { it.status = 'descartado'; }, 'Cargo descartado'); },
  inboxRestore: async ds => {
    const it = (D().inbox || []).find(x => x.id === ds.id); if (!it) return;
    if (it.manual) {
      if (!(await Confirm.ask({ title: 'Desvincular aviso', message: 'Este aviso se reconoció como un movimiento que ya habías registrado a mano. Tu movimiento se conserva; el aviso volverá a la bandeja.', confirm: 'Desvincular' }))) return;
      return withUndo(() => { const mv = it.movementId && Data.get('movements', it.movementId); if (mv) delete mv.inboxId; it.status = 'pendiente'; delete it.movementId; it.manual = false; }, 'El aviso volvió a la bandeja');
    }
    if (it.status === 'registrado' && !(await Confirm.ask({ title: 'Anular registro', message: 'Se eliminará el movimiento creado desde este aviso y el cargo volverá a la bandeja.', confirm: 'Anular', danger: true }))) return;
    withUndo(() => { if (it.movementId) Data.remove('movements', it.movementId); it.status = 'pendiente'; delete it.movementId; it.auto = false; }, 'El cargo volvió a la bandeja');
  },
  toggleRuleAuto: ds => { const r = (D().rules || []).find(x => x.id === ds.id); if (!r) return; r.auto = !r.auto; App.refresh(); Toast.show(r.merchant + (r.auto ? ': se registrará automáticamente' : ': te preguntaré antes de registrar'), 'ok'); },
  deleteRule: async ds => { const r = (D().rules || []).find(x => x.id === ds.id); if (!r) return; if (!(await Confirm.ask({ title: 'Olvidar ' + r.merchant, message: 'La app dejará de categorizar este comercio automáticamente. Los movimientos ya registrados no cambian.', confirm: 'Olvidar' }))) return; withUndo(() => { D().rules = D().rules.filter(x => x.id !== r.id); }, 'Regla olvidada'); },
  newSender: ds => Forms.sender(null, ds && ds.from ? { email: ds.from } : null),
  editSender: ds => { const s = (D().senders || []).find(x => x.id === ds.id); if (s) Forms.sender(s); },
  deleteSender: async ds => { const s = (D().senders || []).find(x => x.id === ds.id); if (!s) return; if (!(await Confirm.ask({ title: 'Quitar ' + s.email, message: 'La app dejará de buscar avisos de este remitente. Los cargos ya registrados no cambian.', confirm: 'Quitar', danger: true }))) return; withUndo(() => { D().senders = D().senders.filter(x => x.id !== s.id); }, 'Remitente quitado'); },
  deleteCard: ds => { withUndo(() => { D().cards = (D().cards || []).filter(x => x.id !== ds.id); }, 'Tarjeta quitada'); },
  /* Respaldos y mantenimiento */
  exportJson: () => Exporter.json(),
  findDuplicates: () => {
    const g = Calc.duplicates();
    if (!g.length) { Modal.info('Revisión de duplicados', '<div class="empty">No se encontraron registros redundantes. ✓</div>'); return; }
    Modal.info('Posibles registros redundantes (' + g.length + ')', '<p class="small muted" style="margin-top:0">Revisa cada grupo y elimina el que sobra. Cada eliminación pide confirmación.</p>' + g.map(x => '<div class="card glass" style="padding:14px 16px;margin-bottom:10px"><b>' + esc(x.title) + '</b>' + (x.hint ? '<div class="tiny muted">' + esc(x.hint) + '</div>' : '') + x.items.map(it => '<div class="list-item"><span class="small">' + esc(it.label) + '</span>' + (it.action ? btn('Eliminar', it.action, { id: it.id }, 'sm danger') : '') + '</div>').join('') + '</div>').join(''), true);
  },
  setupDone: ds => { D().meta.setup[ds.key] = true; App.refresh(); },
  setupHide: () => { D().meta.setup.hidden = true; App.refresh(); },
  importJson: () => { const f = $('importFile'); f.value = ''; f.click(); },
  resetData: async () => {
    if (!(await Confirm.ask({ title: 'Restaurar datos iniciales', message: 'Se borrarán todos tus movimientos, cambios y configuraciones.', confirm: 'Continuar', danger: true }))) return;
    if (!(await Confirm.ask({ title: 'Confirmación final', message: 'Te recomendamos exportar un respaldo antes. ¿Restaurar los datos iniciales?', confirm: 'Sí, restaurar', danger: true }))) return;
    const snap = JSON.stringify(D());
    Store.reset(); resetUi(); App.render();
    Toast.show('Datos iniciales restaurados', 'ok', { label: 'Deshacer', fn: () => { Store.replace(Schema.migrate(JSON.parse(snap))); App.render(); } });
  },
  exportIcs: () => Exporter.ics(),
  exportCsv: () => Exporter.csv()
};
function run(name, el) {
  const fail = e => { console.error(e); Toast.show('Ocurrió un error: ' + e.message, 'err'); };
  try { const r = Actions[name](el.dataset, el); if (r && typeof r.catch === 'function') r.catch(fail); }
  catch (e) { fail(e); }
}
function setPartidaAmount(p, key, v) {
  if (!p.overrides) p.overrides = {};
  if (key && Math.abs(v - (Number(p.amount) || 0)) >= 0.005) p.overrides[key] = r2(v);
  else if (key) delete p.overrides[key];
  else p.amount = r2(v);
}

/* --- Configuración: guardado con validación --- */
function saveSettings() {
  const g = id => $('cfg_' + id);
  const v = {
    currency: g('currency').value, userName: g('userName').value.trim().slice(0, 40), q1Amount: num(g('q1Amount').value), q1Day: num(g('q1Day').value),
    q2Amount: num(g('q2Amount').value), q2Day: num(g('q2Day').value), weekStart: Number(g('weekStart').value), startDate: g('startDate').value
  };
  const errs = {};
  ['q1Amount', 'q2Amount'].forEach(k => { if (!Number.isFinite(v[k])) errs[k] = 'Escribe un número válido'; else if (v[k] < 0) errs[k] = 'No se aceptan montos negativos'; });
  ['q1Day', 'q2Day'].forEach(k => { if (!Number.isInteger(v[k]) || v[k] < 1 || v[k] > 31) errs[k] = 'Día entre 1 y 31'; });
  if (!errs.q1Day && !errs.q2Day && v.q1Day >= v.q2Day) errs.q2Day = 'Debe ser posterior al día de la quincena 1';
  if (!errs.q1Day && v.q1Day > 28) errs.q1Day = 'Usa un día entre 1 y 28';
  if (!isDate(v.startDate)) errs.startDate = 'Fecha inválida';
  document.querySelectorAll('#settingsForm .field').forEach(f => { f.classList.remove('invalid'); const e = f.querySelector('.err'); if (e) e.textContent = ''; });
  Object.keys(errs).forEach(k => { const f = document.querySelector('#settingsForm .field[data-field="' + k + '"]'); if (f) { f.classList.add('invalid'); f.querySelector('.err').textContent = errs[k]; } });
  if (Object.keys(errs).length) { $('settingsError').textContent = 'Revisa los campos marcados.'; return; }
  $('settingsError').textContent = '';
  Object.assign(D().settings, v);
  D().meta.setup.income = true;
  ui.weekStart = null; ui.flowStart = null; ui.dashWeek = null;
  App.refresh();
  Toast.show('Configuración guardada · aplicación recalculada', 'ok');
}

/* =====================================================================
   APP — inicialización, render y eventos globales
   ===================================================================== */
let quickTimer = null;
const App = {
  render() {
    const main = $('main');
    let strip = '';
    try { if (ui.section !== 'dashboard') strip = weekStrip(); } catch (e) { console.error(e); }
    try { main.innerHTML = strip + Views[ui.section](); }
    catch (e) { console.error(e); main.innerHTML = '<div class="card glass"><h3>Ocurrió un error al mostrar esta sección</h3><p class="muted">' + esc(e.message) + '</p>' + btn('Ir al Dashboard', 'goto', { target: 'dashboard' }) + '</div>'; }
    this.renderTop();
  },
  renderTop() {
    try {
      const sf = Calc.safe(), tone = Calc.safeTone(sf.safe);
      const total = Calc.liquid();
      $('topDs').innerHTML = '<small>Disponible real</small><b class="num" style="color:var(--' + (total < 0 ? 'bad' : 'text') + ')">' + money(total) + '</b>';
      $('topDs').title = 'Disponible real (ya cobrado − ya pagado): ' + money(total) + ' · seguro hasta el ' + fmtDate(sf.nextPayday) + ': ' + money(sf.safe);
      const n = Calc.alerts().length;
      $('alertBtn').hidden = !n; $('alertCount').textContent = n; $('alertBtn').title = n + (n === 1 ? ' registro pendiente' : ' registros pendientes') + ' (cobros y pagos)';
      $('navAlerts').hidden = !n; $('navAlerts').textContent = n;
      const ib = Bank.pending().length;
      ['navInbox', 'bnInbox'].forEach(id => { const el = $(id); if (el) { el.hidden = !ib; el.textContent = ib; } });
      const nm = (D().settings.userName || '').trim();
      $('greetName').textContent = nm || 'NIW'; $('greetHello').textContent = nm ? 'Hola,' : 'Bienvenido a';
      $('avatar').textContent = (nm || 'N').slice(0, 1).toUpperCase();
      $('sideFoot').textContent = (Store.persistent ? 'Guardado localmente' : 'Sin almacenamiento local') + (Store.lastSaved ? ' · ' + p2(Store.lastSaved.getHours()) + ':' + p2(Store.lastSaved.getMinutes()) : '');
    } catch (e) { console.error(e); }
  },
  refresh() { Store.save(); this.render(); },
  bind() {
    const main = $('main');
    main.addEventListener('click', e => {
      const el = e.target.closest('[data-action]');
      if (!el || !main.contains(el)) return;
      if (Actions[el.dataset.action]) run(el.dataset.action, el);
    });
    main.addEventListener('submit', e => { if (e.target.id === 'settingsForm') { e.preventDefault(); try { saveSettings(); } catch (err) { console.error(err); Toast.show('Error al guardar: ' + err.message, 'err'); } } });
    main.addEventListener('input', e => this.onInput(e));
    main.addEventListener('change', e => this.onInput(e));
    $('topDs').addEventListener('click', () => { if (ui.section !== 'dashboard') Nav.go('dashboard'); else Actions.safeDetail(); });
    $('alertBtn').addEventListener('click', () => Actions.showAlerts());
    $('importFile').addEventListener('change', e => Exporter.importFile(e.target.files && e.target.files[0]));
  },
  onInput(e) {
    const el = e.target, id = el.id;
    // Ajustes rápidos del flujo: recalcular al instante
    if (el.dataset.quick) {
      const v = num(el.value), errEl = el.parentElement.querySelector('.err');
      if (!Number.isFinite(v) || v < 0) { el.parentElement.classList.add('invalid'); if (errEl) errEl.textContent = 'Monto inválido'; return; }
      el.parentElement.classList.remove('invalid'); if (errEl) errEl.textContent = '';
      if (el.dataset.quick === 'food') {
        let p = Calc.partida('Alimentación');
        if (!p) { p = { id: uid('bud'), category: 'Alimentación', amount: 0, period: 'semanal', overrides: {}, notes: '' }; D().budgets.push(p); }
        if (p.period === 'semanal') p.amount = r2(v); else p.amount = r2(v * 52 / 12);
      } else D().settings[el.dataset.quick] = r2(v);
      $('flowCards').innerHTML = Views.flowCards();
      this.renderTop();
      clearTimeout(quickTimer); quickTimer = setTimeout(() => Store.save(), 300);
      return;
    }
    const f = ui.mv;
    const mvMap = { mvDate: 'date', mvWeek: 'week', mvMonth: 'month', mvFrom: 'from', mvTo: 'to', mvType: 'type', mvCategory: 'category', mvAccount: 'account', mvStatus: 'status', mvSearch: 'q' };
    if (id === 'mvPeriod') { if (e.type === 'change') { f.period = el.value; App.render(); } return; }
    if (mvMap[id]) { f[mvMap[id]] = el.value; $('mvList').innerHTML = Views.movList(); return; }
    if (el.classList.contains('pinput')) {
      if (e.type !== 'change') return;
      const p = Data.get('budgets', el.dataset.pid), v = num(el.value);
      if (!p) return;
      if (!Number.isFinite(v) || v < 0) { Toast.show('Monto de partida inválido', 'err'); el.value = Calc.partidaAmountFor(p, el.dataset.key); return; }
      setPartidaAmount(p, el.dataset.key, v);
      Store.save(); $('budBody').innerHTML = Views.budBody(); this.renderTop();
      Toast.show('Partida de ' + p.category + ' para este periodo: ' + money(v), 'ok');
      return;
    }
    if (id === 'budFrom' || id === 'budTo') { if (el.value) { ui[id] = el.value; $('budBody').innerHTML = Views.budBody(); } return; }
    if ((id === 'budMonth' || id === 'budWeek') && e.type === 'change' && el.value) { ui[id] = el.value; App.render(); return; }
    if (id === 'dashMonth' && e.type === 'change' && /^\d{4}-\d{2}$/.test(el.value)) { ui.dashMonth = el.value; ui.dashScope = 'mes'; const ms = el.value + '-01'; if (ui.dashWeek < Calc.weekStartOf(ms) || ui.dashWeek > monthEnd(ms)) ui.dashWeek = Calc.weekStartOf(ms <= today() && today() <= monthEnd(ms) ? today() : ms); App.render(); return; }
    if (id === 'resMonth' && e.type === 'change' && /^\d{4}-\d{2}$/.test(el.value)) { ui.resMonth = el.value; App.render(); return; }
    if ((id === 'cfg_q1Amount' || id === 'cfg_q2Amount') && $('cfg_expected')) { const a = num($('cfg_q1Amount').value), b = num($('cfg_q2Amount').value); $('cfg_expected').textContent = Number.isFinite(a) && Number.isFinite(b) ? money(a + b) : '—'; return; }
    if (id === 'repMonth' && e.type === 'change' && el.value) { ui.repMonth = el.value; App.render(); }
  },
  init() {
    const status = Store.load();
    Nav.build();
    Modal.init();
    this.bind();
    if (SIM_DATE) { window.MF = { Bank, Calc, D, Store, dayDetailHtml }; $('simBadge').hidden = false; $('simBadge').textContent = 'Fecha simulada: ' + fmtDate(SIM_DATE); }
    const h = (location.hash || '').slice(1);
    Nav.go(SECTIONS.some(s => s.id === h) || ROUTES[h] ? h : 'dashboard', true);
    // Revisión automática del correo al abrir (si está conectado)
    const mail = D().settings.mail || {};
    if (Bank.configured() && mail.auto !== false && navigator.onLine !== false) setTimeout(() => Bank.sync(true).then(r => { if (r && r.added) App.render(); }), 600);
    if (status === 'migrated') Toast.show('Tus datos se actualizaron a la nueva versión (se guardó una copia de la versión anterior).', 'ok');
    if (status === 'corrupt') Toast.show('Los datos guardados estaban dañados. Se restauraron los datos iniciales (se guardó una copia del contenido dañado).', 'err');
    if (!Store.persistent) Toast.show('Este navegador no permite guardar datos locales. Usa Exportar respaldo para no perder información.', 'warn');
  }
};

window.addEventListener('error', e => { console.error(e.error || e.message); try { Toast.show('Error: ' + (e.message || 'desconocido'), 'err'); } catch (x) { /* noop */ } });
window.addEventListener('unhandledrejection', e => { console.error(e.reason); });
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => App.init()); else App.init();
})();
</script>
