  /* --- Alertas: días de cobro y pago sin registrar lo real --- */
  alerts(t) {
    t = t || today();
    const d = D(), s = d.settings, out = [];
    const from = addDays(t, -62) < s.startDate ? s.startDate : addDays(t, -62);
    if (from > t) return out;
    this.paydaysBetween(from, t).forEach(p => {
      if (!this.quincenaFor(p.date))
        out.push({ key: 'cobro|' + p.date, kind: 'cobro', date: p.date, title: (p.date === t ? 'Hoy es día de cobro' : 'Cobro sin registrar') + ': registra tu nómina real', sub: 'Esperado ' + money(p.amount) + ' · quincena ' + p.q, amount: p.amount, action: 'newIncomeQ', data: { date: p.date } });
    });
    d.recurringExpenses.filter(r => r.active).forEach(r => this.occurrences(r, from, t).forEach(dt => {
      if (!this.isOccPaid(r, dt)) out.push({ key: 'rec|' + r.id + '|' + dt, kind: 'pago', date: dt, title: (dt === t ? 'Hoy vence' : 'Pago sin registrar') + ': ' + r.name, sub: 'Programado ' + money(r.amount) + (r.payDayTo ? ' · entre día ' + r.payDay + ' y ' + r.payDayTo : ''), amount: r.amount, action: 'payRecurring', data: { id: r.id, date: dt }, skip: true });
    }));
    d.goalPayments.forEach(p => {
      if (p.dueDate >= from && p.dueDate <= t && !this.isPayDone(p)) out.push({ key: 'gp|' + p.id, kind: 'pago', date: p.dueDate, title: (p.dueDate === t ? 'Hoy vence' : 'Pago sin registrar') + ': ' + this.payLabel(p), sub: 'Programado ' + money(p.amount), amount: p.amount, action: 'payGoalPay', data: { id: p.id } });
    });
    // Registrado pendiente cuya fecha ya llegó: confirmar si ya es dinero real
    this.pendingMovs(null, t).forEach(m => {
      const inc = this.liquidEffect(m) > 0;
      out.push({ key: 'pend|' + m.id, kind: inc ? 'cobro' : 'pago', date: m.date, title: (inc ? '¿Ya se cobró?' : '¿Ya se pagó?') + ' ' + (m.description || m.category || 'Movimiento'), sub: 'Registrado ' + money(m.amount) + ' · confírmalo para que cuente en tu disponible real', amount: m.amount, action: 'confirmMov', data: { id: m.id } });
    });
    return out.sort((x, y) => x.date < y.date ? 1 : -1);
  },

  /* --- Compromisos para vincular un gasto (evita contarlo dos veces) --- */
  commitmentCandidates(date, keepKey) {
    const d = D(), s = d.settings, t = isDate(date) ? date : today(), out = [];
    const lo = addDays(t, -45) < s.startDate ? s.startDate : addDays(t, -45);
    const recItem = (r, dt, key) => ({ key, name: r.name, date: dt, amount: r.amount, category: r.category, account: r.account, desc: r.name });
    const payItem = (p, key) => { const g = this.goal(p.goalId); return { key, name: this.payLabel(p), date: p.dueDate, amount: p.amount, category: this.goalPayCategory(g), desc: this.payLabel(p) + ' (' + fmtDateS(p.dueDate) + ')' }; };
    d.recurringExpenses.filter(r => r.active).forEach(r => this.occurrences(r, lo, addDays(t, 45)).forEach(dt => {
      const key = 'rec|' + r.id + '|' + dt;
      if (!this.isOccPaid(r, dt) || key === keepKey) out.push(recItem(r, dt, key));
    }));
    d.goalPayments.forEach(p => {
      const key = 'gp|' + p.id;
      if ((p.dueDate >= addDays(t, -60) && p.dueDate <= addDays(t, 150) && !this.isPayDone(p)) || key === keepKey) out.push(payItem(p, key));
    });
    if (keepKey && !out.some(c => c.key === keepKey)) {
      const k = keepKey.split('|');
      if (k[0] === 'rec') { const r = d.recurringExpenses.find(x => x.id === k[1]); if (r) out.push(recItem(r, k[2], keepKey)); }
      if (k[0] === 'gp') { const p = d.goalPayments.find(x => x.id === k[1]); if (p) out.push(payItem(p, keepKey)); }
    }
    return out.sort((a, b) => a.date < b.date ? -1 : 1);
  },

  /* --- Detección de registros redundantes --- */
  duplicates() {
    const d = D(), groups = [];
    const group = (list, keyFn) => { const m = {}; list.forEach(x => { const k = keyFn(x); if (k == null) return; (m[k] = m[k] || []).push(x); }); return Object.keys(m).map(k => m[k]).filter(g => g.length > 1); };
    const mvItem = m => ({ label: fmtDate(m.date) + ' · ' + TYPE_LABEL[m.type] + ' · ' + m.description + ' · ' + money(m.amount), action: 'deleteMovement', id: m.id });
    group(d.movements, m => [m.type, m.date, r2(m.amount), (m.description || '').trim().toLowerCase(), m.account, m.toAccount || '', m.creditDebtId || ''].join('|'))
      .forEach(g => groups.push({ title: 'Movimientos idénticos', hint: 'Mismo tipo, fecha, monto, descripción y cuenta.', items: g.map(mvItem) }));
    group(d.movements.filter(m => m.incomeKind === 'quincena'), m => this.payQOf(m))
      .forEach(g => groups.push({ title: 'Dos pagos de nómina en la misma quincena', hint: 'Solo debe haber uno por quincena; lo adicional es ingreso extraordinario.', items: g.map(mvItem) }));
    group(d.movements.filter(m => m.recurringId), m => m.recurringId + '|' + m.occDate)
      .forEach(g => groups.push({ title: 'Mismo compromiso pagado dos veces', hint: 'Dos movimientos pagan la misma fecha de un gasto recurrente.', items: g.map(mvItem) }));
    group(d.movements.filter(m => m.goalPaymentId), m => m.goalPaymentId)
      .forEach(g => groups.push({ title: 'Mismo pago programado registrado dos veces', items: g.map(mvItem) }));
    d.movements.filter(m => m.recurringId || m.goalPaymentId).forEach(linked => {
      const twins = d.movements.filter(x => x.type === 'gasto' && !x.recurringId && !x.goalPaymentId && x.category === linked.category && Math.abs(x.amount - linked.amount) < 0.5 && Math.abs(diffDays(x.date, linked.date)) <= 15);
      if (twins.length) groups.push({ title: 'Gasto posiblemente registrado dos veces', hint: 'Un gasto libre coincide con un compromiso ya pagado (' + linked.description + ').', items: [mvItem(linked)].concat(twins.map(mvItem)) });
    });
    group(d.recurringExpenses, r => r.name.trim().toLowerCase()).forEach(g => groups.push({ title: 'Gastos recurrentes con el mismo nombre', items: g.map(r => ({ label: r.name + ' · ' + money(r.amount) + ' · ' + FREQ_LABEL[r.frequency], action: 'deleteRecurring', id: r.id })) }));
    group(d.debts, x => x.name.trim().toLowerCase()).forEach(g => groups.push({ title: 'Deudas con el mismo nombre', items: g.map(x => ({ label: x.name + ' · saldo ' + money(this.debtCurrent(x)), action: 'deleteDebt', id: x.id })) }));
    group(d.goals, x => x.name.trim().toLowerCase()).forEach(g => groups.push({ title: 'Metas con el mismo nombre', items: g.map(x => ({ label: x.name + ' · ' + this.goalType(x).label + ' · ' + money(x.target), action: 'deleteGoal', id: x.id })) }));
    group(d.goalPayments, p => p.goalId + '|' + p.dueDate + '|' + r2(p.amount)).forEach(g => groups.push({ title: 'Pagos programados repetidos', items: g.map(p => ({ label: this.payLabel(p) + ' · ' + fmtDate(p.dueDate) + ' · ' + money(p.amount), action: 'deleteGoalPay', id: p.id })) }));
    group(d.budgets, p => p.category).forEach(g => groups.push({ title: 'Partidas de presupuesto repetidas', items: g.map(p => ({ label: p.category + ' · ' + money(p.amount) + ' ' + p.period, action: 'deletePartida', id: p.id })) }));
    return groups;
  },

  /* --- Eventos (calendarios, franja semanal, próximos pagos) --- */
  eventsBetween(a, b, opts) {
    // Los compromisos ya registrados se muestran en la fecha REAL del registro (adelantos y atrasos);
    // los pendientes, en su fecha programada. Con opts.ghosts se agrega un aviso en el día programado.
    const d = D(), ev = [];
    opts = opts || {};
    const A = addDays(a, -62), B = addDays(b, 62);
    const add = (e, realDate) => {
      if (isDate(realDate) && realDate !== e.date) { e.plannedDate = e.date; e.date = realDate; e.shift = diffDays(e.plannedDate, realDate); e.shiftLabel = this.shiftLabel(e.plannedDate, realDate); }
      if (e.date >= a && e.date <= b) ev.push(e);
      else if (opts.ghosts && e.plannedDate && e.plannedDate >= a && e.plannedDate <= b) ev.push({ date: e.plannedDate, kind: e.kind, title: e.title, ghost: true, info: true, amount: null, movedTo: e.date, shift: e.shift, income: e.income, movId: e.movId });
    };
    if (!opts.noIncome) this.paydaysBetween(A, B).forEach(p => {
      const rm = this.quincenaFor(p.date);
      add({ date: p.date, kind: 'ingreso', title: 'Ingreso quincena ' + p.q, amount: p.amount, paid: !!rm, real: rm ? rm.amount : null, movId: rm ? rm.id : '', action: rm ? null : 'newIncomeQ', id: '', income: true }, rm && rm.date);
    });
    d.recurringExpenses.filter(r => r.active).forEach(r => {
      this.occurrences(r, A, B).forEach(dt => { const pm = this.occPayment(r, dt); add({
        date: dt, kind: r.category === 'Vivienda' ? 'renta' : (r.category === 'Servicios' ? 'servicio' : 'recurrente'),
        title: r.name + (r.payDayTo ? ' (entre día ' + r.payDay + ' y ' + r.payDayTo + ')' : ''), amount: r.amount, paid: !!pm, real: pm ? pm.amount : null, movId: pm ? pm.id : '', action: 'payRecurring', id: r.id
      }, pm && pm.date); });
    });
    d.goalPayments.forEach(p => { if (p.dueDate >= A && p.dueDate <= B) { const g = this.goal(p.goalId); const pi = this.payInfo(p); add({ date: p.dueDate, kind: g && g.kind === 'viaje' ? 'viaje' : 'meta', title: this.payLabel(p), amount: p.amount, paid: !!pi, real: pi ? pi.amount : null, movId: pi && pi.mov ? pi.mov.id : '', action: 'payGoalPay', id: p.id }, pi && pi.date); } });
    d.goals.forEach(g => { if (isDate(g.date) && g.date >= a && g.date <= b) ev.push({ date: g.date, kind: g.kind === 'viaje' ? 'viaje' : 'meta', title: 'Fecha objetivo · ' + g.name, amount: null, info: true }); });
    d.debts.forEach(db => { if (isDate(db.dueDate) && db.dueDate >= a && db.dueDate <= b) { const c = this.debtCurrent(db); ev.push({ date: db.dueDate, kind: 'deuda', title: 'Fecha límite · ' + db.name, amount: c, paid: c <= 0.004, action: 'payDebt', id: db.id }); } });
    return ev.sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : 0);
  },
  upcoming(days) {
    const t = today(), s = D().settings;
    const from = s.startDate > addDays(t, -90) ? s.startDate : addDays(t, -90);
    return this.eventsBetween(from, addDays(t, days), { noIncome: true })
      .filter(e => !e.info && !e.paid && e.amount > 0 && (e.kind !== 'deuda' || e.date >= t))
      .map(e => Object.assign(e, { overdue: e.date < t }));
  }
};

/* =====================================================================
   BANK — notificaciones de cargos: lectura, bandeja, reglas y aprendizaje
   ===================================================================== */
const STOP = new Set(['de', 'del', 'la', 'el', 'en', 'con', 'por', 'para', 'los', 'las', 'sa', 'cv', 'sapi', 'mex', 'mx', 'mexico', 'com', 'www', 'pos', 'compra', 'cargo', 'pago', 'tarjeta', 'credito', 'debito', 'mxn', 'usd', 'suc', 'sucursal', 'y', 'srl', 'rl', 'de', 'no']);
function deaccent(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, ''); }
const Bank = {
  /* ---- Lectura de una notificación ---- */
  parseAmount(txt) {
    const pats = [
      /(?:por un (?:monto|importe) de|monto(?: de la (?:compra|operaci[oó]n))?|importe|cargo de|compra de|consumo de|por la cantidad de|total|cantidad|por)\s*[:\-]?\s*\$?\s*([\d]{1,3}(?:[.,\s]\d{3})*(?:[.,]\d{2})?|\d+(?:[.,]\d{2})?)\s*(MXN|M\.?N\.?|USD|pesos)?/i,
      /\$\s?([\d]{1,3}(?:[,]\d{3})*(?:\.\d{2})?|\d+(?:\.\d{2})?)\s*(MXN|M\.?N\.?|USD)?/i,
      /([\d]{1,3}(?:,\d{3})*\.\d{2})\s*(MXN|M\.?N\.?|USD|pesos)/i
    ];
    for (const re of pats) {
      const m = re.exec(txt);
      if (m) {
        let n = m[1].replace(/\s/g, '');
        if (/^\d{1,3}(\.\d{3})+(,\d{2})?$/.test(n)) n = n.replace(/\./g, '').replace(',', '.');
        else n = n.replace(/,(?=\d{3}(\D|$))/g, '').replace(',', '.');
        const v = Number(n);
        if (Number.isFinite(v) && v > 0) return { amount: r2(v), currency: /USD/i.test(m[2] || '') ? 'USD' : 'MXN' };
      }
    }
    return null;
  },
  parseMerchant(txt) {
    const pats = [
      /(?:comercio|establecimiento|negocio|lugar|descripci[oó]n|concepto)\s*[:\-]\s*([^\n\r|]{2,50})/i,
      /(?:compra|cargo|consumo|pago|transacci[oó]n)\s+(?:realizad[oa]\s+|aprobad[oa]\s+|por\s+\$?[\d.,]+\s+(?:MXN\s+)?)?en\s+([A-Za-z0-9][^\n\r]{1,50}?)(?=\s+(?:con|por|el|desde|a las|usando|fue|ha)\b|[.,;\n\r]|$)/i,
      /\ben\s+([A-Z0-9][A-Z0-9 *&.\-'/]{2,40}?)(?=\s+(?:con|por|el|a las)\b|[.,;\n\r]|$)/
    ];
    for (const re of pats) { const m = re.exec(txt); if (m) { const v = m[1].replace(/\s+/g, ' ').trim().replace(/[.:,-]+$/, ''); if (v && !/^\$?[\d.,]+$/.test(v)) return v.slice(0, 50); } }
    return '';
  },
  parseLast4(txt) { const m = /(?:terminaci[oó]n|termina(?:da)?\s+en|con\s+terminaci[oó]n|\*{2,}|x{2,}|•{2,}|tarjeta\s+(?:no\.?\s*)?(?:\S*\s)?)\s*(\d{4})\b/i.exec(txt); return m ? m[1] : ''; },
  parseDate(txt, fallback) {
    let m = /(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/.exec(txt);
    if (m) { let y = +m[3]; if (y < 100) y += 2000; const ds = ymd(y, +m[2] - 1, +m[1]); if (isDate(ds) && +m[2] <= 12) return ds; }
    m = /(\d{1,2})\s+de\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)(?:\s+(?:de|del)\s+(\d{4}))?/i.exec(deaccent(txt));
    if (m) { const mo = MESES.indexOf(m[2].toLowerCase()); const y = m[3] ? +m[3] : parts(fallback || today()).y; return ymd(y, mo, +m[1]); }
    return isDate(fallback) ? fallback : today();
  },
  parse(text, meta) {
    meta = meta || {};
    const txt = String((meta.subject || '') + '\n' + (text || '')).replace(/ /g, ' ');
    const a = this.parseAmount(txt);
    if (!a) return null;
    const isCash = this.isCashText(txt);
    const isCredit = !isCash && /(abono|dep[oó]sito recibido|reembolso|devoluci[oó]n|recibiste|te transfirieron)/i.test(txt) && !/(compra|cargo|consumo)/i.test(txt);
    const fb = meta.date ? String(meta.date).slice(0, 10) : today();
    return { amount: a.amount, currency: a.currency, merchant: this.parseMerchant(txt) || (meta.subject || 'Cargo').slice(0, 40), last4: this.parseLast4(txt), date: this.parseDate(txt, fb), kind: isCash ? 'efectivo' : isCredit ? 'abono' : 'cargo', cashKind: isCash ? (/disposici[oó]n/i.test(txt) ? 'disposicion' : 'retiro') : '' };
  },
  isCashText(txt) { return /(retiro (?:de |en )?efectivo|retiro en cajero|retiraste|disposici[oó]n (?:de |en )?efectivo|disposici[oó]n en cajero|cajero autom[aá]tico|\bATM\b)/i.test(txt); },
  // Cuenta "Efectivo": el dinero retirado se maneja como traspaso de saldo
  cashAccount() {
    const d = D();
    let a = d.accounts.find(x => x.id === 'acc_efectivo') || d.accounts.find(x => /efectivo/i.test(x.name) && x.type === 'liquida');
    if (!a) { a = { id: 'acc_efectivo', name: 'Efectivo', type: 'liquida', initialBalance: 0, notes: 'Retiros y disposiciones en efectivo' }; d.accounts.push(a); }
    return a;
  },
  // Retiro (débito) = traspaso cuenta → Efectivo. Disposición (crédito) = la deuda de la tarjeta sube y el efectivo entra.
  cashMovement(o) {
    const cash = this.cashAccount(), [t, id] = String(o.payWith || '').split('|');
    const credit = t === 'debt';
    const src = credit ? Data.get('debts', id) : Data.get('accounts', id);
    const m = { id: uid('mov'), type: 'transferencia', date: o.date, amount: r2(o.amount), category: 'Transferencia', subcategory: '', description: o.description || (credit ? 'Disposición de efectivo' : 'Retiro de efectivo') + (src ? ' · ' + src.name : ''), account: credit ? '' : id, toAccount: cash.id, method: credit ? 'Crédito' : 'Efectivo', notes: o.notes || '', cashKind: credit ? 'disposicion' : 'retiro', createdAt: new Date().toISOString(), status: o.status || 'realizado' };
    if (credit) m.creditDebtId = id;

  },
  postCash(item, payWith) {

    D().movements.push(m);
    item.status = 'registrado'; item.movementId = m.id; item.postedAt = new Date().toISOString();
    if (item.last4 && !this.cardFor(item.last4)) { const [t, id] = (payWith || '').split('|'); if (id) D().cards.push(t === 'debt' ? { id: uid('card'), last4: item.last4, debtId: id } : { id: uid('card'), last4: item.last4, accountId: id }); }
    return m;
  },
  // ¿Ya lo registraste a mano? mismo monto, ±2 días, sin aviso vinculado
  manualMatch(p) {
    const d = D(), used = new Set(d.inbox.map(x => x.movementId).filter(Boolean));
    const types = p.kind === 'efectivo' ? ['transferencia', 'gasto'] : p.kind === 'abono' ? ['ingreso'] : ['gasto', 'pago_deuda', 'transferencia'];
    return d.movements.filter(m => types.includes(m.type) && !m.inboxId && !used.has(m.id) && Math.abs(m.amount - p.amount) < 0.005 && Math.abs(diffDays(m.date, p.date)) <= 2)
      .sort((a, b) => Math.abs(diffDays(a.date, p.date)) - Math.abs(diffDays(b.date, p.date)))[0] || null;
  },
  // Clave estable del comercio (agrupa "NETFLIX.COM 123" y "Netflix com")
  merchantKey(name) {
    let s = deaccent(name).toUpperCase().replace(/\b(MERPAGO|MERCADOPAGO|MP|PAYPAL|CLIP|SR|SQ|OXXO PAY|POS|COMPRA|CARGO|DLO|STRIPE|CONEKTA|OPENPAY|SPEI)\s*\*?\s*/g, '').replace(/[*#]/g, ' ');
    s = s.replace(/\b\d{3,}\b/g, ' ').replace(/[^A-Z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
    return s.split(' ').filter(w => w && !STOP.has(w.toLowerCase())).slice(0, 3).join(' ') || s || 'SIN NOMBRE';
  },
  pretty(name) { return String(name || '').toLowerCase().replace(/\b\w/g, c => c.toUpperCase()).replace(/\s+/g, ' ').trim(); },

  /* ---- Aprendizaje: reglas por comercio + clasificador de palabras ---- */
  tokens(s) { return deaccent(s).toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length >= 3 && !/^\d+$/.test(w) && !STOP.has(w)); },
  model() {
    const d = D(), counts = {}, totals = {}, docs = {}; const vocab = new Set();
    const add = (text, cat, w) => { if (!cat) return; docs[cat] = (docs[cat] || 0) + w; this.tokens(text).forEach(t => { vocab.add(t); counts[cat] = counts[cat] || {}; counts[cat][t] = (counts[cat][t] || 0) + w; totals[cat] = (totals[cat] || 0) + w; }); };
    (d.rules || []).forEach(r => add(r.merchant + ' ' + r.key, r.category, 3));
    d.movements.filter(m => m.type === 'gasto').slice(-600).forEach(m => add((m.merchant || '') + ' ' + m.description + ' ' + (m.subcategory || ''), m.category, 1));
    return { counts, totals, docs, vocab, V: vocab.size || 1, N: Object.values(docs).reduce((a, b) => a + b, 0) };
  },
  // Cada palabra conocida vota por las categorías donde ha aparecido (proporcional a su uso)
  classify(text, model) {
    const md = model || this.model(), toks = Array.from(new Set(this.tokens(text))).filter(t => md.vocab.has(t));
    if (!toks.length) return null;
    const cats = Object.keys(md.counts), agg = {};
    toks.forEach(t => {
      const tot = cats.reduce((a, c) => a + ((md.counts[c] || {})[t] || 0), 0);
      if (tot) cats.forEach(c => { const v = ((md.counts[c] || {})[t] || 0) / tot; if (v) agg[c] = (agg[c] || 0) + v / toks.length; });
    });
    const best = Object.keys(agg).sort((a, b) => agg[b] - agg[a])[0];
    return best && agg[best] >= 0.5 ? { category: best, confidence: Math.min(0.99, agg[best]) } : null;
  },
  rule(key) { return (D().rules || []).find(r => r.key === key); },
  suggest(item, model) {

    const c = this.classify(item.merchant, model);

  /* ---- Remitentes: correo del banco → banco y cuenta/tarjeta ---- */

  payOptions() { const d = D(); return d.debts.map(x => ({ value: 'debt|' + x.id, label: 'Tarjeta de crédito · ' + x.name })).concat(d.accounts.map(a => ({ value: 'acc|' + a.id, label: 'Débito / cuenta · ' + a.name }))); },

  /* ---- Entrada de notificaciones ---- */

  /* ---- Sincronización con Gmail (Apps Script en tu cuenta) ---- */

  async sync(silent) {

const Toast = {
  // action: { label, fn } → botón dentro del aviso (p. ej. "Deshacer")
  show(msg, type, action) {
    const root = $('toastRoot'); if (!root) return;
    const el = document.createElement('div');
    el.className = 'toast ' + (type || 'ok');
    el.setAttribute('role', 'status');
    const t = document.createElement('span'); t.textContent = msg; el.appendChild(t);
    if (action) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = action.label; b.className = 'toast-action';
      b.addEventListener('click', () => { try { action.fn(); } catch (e) { console.error(e); } el.remove(); });
      el.appendChild(b);
    }
    root.appendChild(el);
    while (root.children.length > 3) root.firstElementChild.remove();
    const ms = action ? 7000 : 3200;
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, ms);
    setTimeout(() => el.remove(), ms + 400);
  }
};
/* Confirmación propia (los diálogos del sistema se bloquean en vistas previas e iframes) */
const Confirm = {
  ask(o) {
    return new Promise(resolve => {
      const root = $('confirmRoot');
      const choices = o.choices || null;
      const body = '<p class="confirm-msg">' + esc(o.message || '') + '</p>' +
        (o.html || '') +
        (choices ? choices.map((c, i) => '<label class="choice"><input type="radio" name="cchoice" value="' + esc(c.value) + '"' + (i === 0 ? ' checked' : '') + '><span><b>' + esc(c.label) + '</b>' + (c.hint ? '<br><span class="small muted">' + esc(c.hint) + '</span>' : '') + '</span></label>').join('') : '') +
        (o.select ? '<label class="field mt"><span class="lbl">' + esc(o.select.label) + '</span><select id="confirmSelect">' + o.select.options.map(x => '<option value="' + esc(x.value) + '">' + esc(x.label) + '</option>').join('') + '</select></label>' : '');
      root.innerHTML = '<div class="modal-back" data-cback><div class="modal" role="alertdialog" aria-modal="true" aria-label="' + esc(o.title) + '"><div class="modal-head"><h3>' + esc(o.title) + '</h3></div><div class="modal-body">' + body + '</div><div class="modal-actions"><button type="button" class="btn ghost" data-confirm="no">' + esc(o.cancel || 'Cancelar') + '</button><button type="button" class="btn ' + (o.danger ? 'danger' : 'primary') + '" data-confirm="yes">' + esc(o.confirm || 'Aceptar') + '</button></div></div></div>';
      const done = val => { root.innerHTML = ''; document.removeEventListener('keydown', onKey, true); resolve(val); };
      const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } };
      document.addEventListener('keydown', onKey, true);
      root.querySelector('[data-confirm="no"]').addEventListener('click', () => done(false));
      root.querySelector('[data-cback]').addEventListener('click', e => { if (e.target.hasAttribute('data-cback')) done(false); });
      root.querySelector('[data-confirm="yes"]').addEventListener('click', () => {
        if (choices) { const c = root.querySelector('input[name="cchoice"]:checked'); return done(c ? c.value : false); }
        if (o.select) return done($('confirmSelect').value);
        done(true);
      });
      root.querySelector('[data-confirm="yes"]').focus();
    });
  }

        { name: 'text', label: 'Texto del correo o SMS', type: 'textarea', required: true, full: true, maxLength: 20000, hint: 'Puedes pegar varios avisos separados por una línea en blanco doble o por ---' },

      preview(v) {
        const chunks = String(v.text || '').split(/\n\s*-{3,}\s*\n|\n\s*\n\s*\n/).map(x => x.trim()).filter(Boolean);

        { name: 'auto', label: 'Revisar el correo cada vez que abro la app', type: 'checkbox', full: true }
      ],
      preview() { return '<div class="small"><b>Cómo funciona.</b> Esta app vive en tu navegador y no puede entrar a tu correo directamente. Un pequeño script en tu cuenta de Gmail lee solo los avisos de tu banco y se los entrega a la app cuando tocas “Revisar correo”.<ol class="steps-list"><li>En <b>script.google.com</b> (con la cuenta donde te llegan los avisos) crea un proyecto nuevo y pega el código.</li><li>Ejecuta <b>generarClave</b>, pega la clave en TOKEN y ejecuta <b>probar</b>.</li><li>Implementar → Aplicación web · Ejecutar como: tú · Acceso: cualquier persona.</li><li>Pega aquí la URL /exec y la misma clave.</li><li>En la Bandeja, agrega los <b>remitentes</b> de tus bancos y asócialos a su cuenta o tarjeta.</li></ol><div class="actions">' + btn(icon('down') + 'Descargar script', 'downloadScript', {}, 'sm') + btn('Ver código', 'showScript', {}, 'sm ghost') + '</div></div>'; },

      onSubmit(v) {
        const reset = v.url !== m.url || (v.fromDate || '') !== (m.fromDate || '') || (v.q || '') !== (m.q || '');
        Object.assign(D().settings.mail, { url: v.url, token: v.token, q: v.q, auto: !!v.auto, fromDate: v.fromDate || '' });
        if (reset) D().settings.mail.lastSync = 0;
        App.refresh(); Toast.show(v.url ? 'Correo conectado · toca “Revisar correo”' : 'Conexión de correo eliminada', 'ok');
      }
    });
  }
};

const Data = {
  get(coll, id) { return D()[coll].find(x => x.id === id); },
  upsert(coll, obj) { if (coll === 'movements' && obj && obj.status !== 'realizado' && obj.status !== 'pendiente') obj.status = Calc.defaultStatus(obj.date); const arr = D()[coll], i = arr.findIndex(x => x.id === obj.id); if (i >= 0) arr[i] = obj; else arr.push(obj); return obj; },
  remove(coll, id) { const arr = D()[coll], i = arr.findIndex(x => x.id === id); if (i >= 0) arr.splice(i, 1); return i >= 0; },
};

const Nav = {
  build() {
    let grp = '';
    $('nav').innerHTML = SECTIONS.map(s => { const head = s.group !== grp ? '<div class="nav-group">' + s.group + '</div>' : ''; grp = s.group; return head + '<button type="button" class="nav-item" data-section="' + s.id + '" id="nav-' + s.id + '">' + icon(s.icon) + '<span>' + s.label + '</span>' + (s.id === 'dashboard' ? '<span class="nav-count" id="navAlerts" hidden></span>' : s.id === 'bandeja' ? '<span class="nav-count" id="navInbox" hidden></span>' : '') + '</button>'; }).join('');
    // Barra inferior (móvil): las 4 tareas más frecuentes + registrar
    $('bottomNav').innerHTML = '<button type="button" class="bn-item" data-bn="dashboard" aria-label="Inicio">' + icon('home') + '</button>' +
      '<button type="button" class="bn-item" data-bn="bandeja" aria-label="Bandeja de cargos">' + icon('inbox') + '<span class="nav-count" id="bnInbox" hidden></span></button>' +
      '<button type="button" class="bn-fab" id="bnFab" aria-label="Registrar">' + icon('plus') + '</button>' +
      '<button type="button" class="bn-item" data-bn="presupuesto" aria-label="Presupuesto">' + icon('target') + '</button>' +
      '<button type="button" class="bn-item" data-bn="more" aria-label="Más secciones">' + icon('menu') + '</button>';
    $('bottomNav').addEventListener('click', e => { const b = e.target.closest('[data-bn]'); if (b) { if (b.dataset.bn === 'more') this.toggle(true); else this.go(b.dataset.bn); } if (e.target.closest('#bnFab')) Actions.quickAdd(); });
    $('fabDesk').innerHTML = icon('plus');
    $('fabDesk').addEventListener('click', () => Actions.quickAdd());
    $('nav').addEventListener('click', e => { const b = e.target.closest('[data-section]'); if (b) this.go(b.dataset.section); });
    $('menuBtn').innerHTML = icon('menu');
    $('menuBtn').addEventListener('click', () => this.toggle());
    $('overlay').addEventListener('click', () => this.toggle(false));
    window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id && (id !== ui.section || ROUTES[id])) this.go(id, true); });
  },
  toggle(force) {
    const open = force === undefined ? !$('sidebar').classList.contains('open') : force;
    $('sidebar').classList.toggle('open', open);
    $('overlay').classList.toggle('show', open);
    $('menuBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
  },
  go(id, fromHash) {
    let tab = null;
    if (ROUTES[id]) { tab = ROUTES[id][1]; id = ROUTES[id][0]; }
    if (!SECTIONS.some(s => s.id === id)) id = 'dashboard';
    if (tab) {
      if (id === 'metas') { const g = D().goals.find(x => x.kind === tab); ui.goalSel = g ? g.id : null; }
      else ui.tabs[id] = tab;
    } else if (id === 'metas' && ui.section !== 'metas') ui.goalSel = null;
    ui.section = id;
    document.querySelectorAll('.bn-item').forEach(b => b.classList.toggle('active', b.dataset.bn === id));
    document.querySelectorAll('.nav-item').forEach(b => { const on = b.dataset.section === id; b.classList.toggle('active', on); if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    $('pageTitle').textContent = SECTIONS.find(s => s.id === id).label;
    try { history.replaceState(null, '', location.pathname + location.search + '#' + id); } catch (e) { /* file:// sin history */ }
    this.toggle(false);
    App.render();
    window.scrollTo(0, 0);
  },
  tabs(sectionId) {
    const s = SECTIONS.find(x => x.id === sectionId), cur = ui.tabs[sectionId];
    return '<div class="tabs subnav" role="tablist">' + s.tabs.map(t => '<button type="button" role="tab" data-action="setTab" data-section="' + sectionId + '" data-tab="' + t[0] + '" class="' + (cur === t[0] ? 'active' : '') + '" aria-selected="' + (cur === t[0]) + '">' + t[1] + '</button>').join('') + '</div>';
  }
};

    h += '<div class="card glass"><div class="card-head"><h3>Por categorizar · ' + pend.length + '</h3>' + (Bank.configured() ? '<span class="sub">correo conectado' + (mail.lastSyncAt ? ' · revisado ' + fmtDate(mail.lastSyncAt.slice(0, 10)) : '') + ' · ' + '<button type="button" class="link-btn" data-action="mailSetup">ajustes</button></span>' : '') + '</div>' +
      (pend.length ? pend.map(x => { const sg = Bank.suggest(x, model), card = Bank.cardFor(x.last4);

        : '<div class="empty">' + (Bank.configured() ? 'No hay cargos nuevos. Toca “Revisar correo” para buscar avisos recientes.' : 'Conecta tu correo o pega el texto de una notificación de tu banco para empezar.') + '</div>') + '</div>';
    const sends = d.senders || [], unknown = Array.from(new Set(pend.filter(x => x.from && !x.senderId && !Bank.senderFor(x.from)).map(x => x.from))).slice(0, 3);
    h += '<div class="card glass mt" id="sendersCard"><div class="card-head"><h3>Remitentes de tus bancos · ' + sends.length + '</h3>' + btn(icon('plus') + 'Agregar remitente', 'newSender', {}, 'sm primary') + '</div><p class="small muted" style="margin-top:0">Cada correo de aviso se asocia a su banco y a la cuenta o tarjeta donde se registra el cargo. La app solo busca avisos de estos remitentes.</p>' +
      (sends.length ? '<div class="table-wrap"><table id="sendersTable"><thead><tr><th>Remitente</th><th>Banco</th><th>Se registra en</th><th></th></tr></thead><tbody>' + sends.map(x => '<tr data-sender="' + esc(x.id) + '"><td><b>' + esc(x.email) + '</b>' + (x.active === false ? ' ' + badge('Pausado', 'b-muted') : '') + '</td><td>' + esc(x.bank) + '</td><td>' + esc(Bank.payLabel(x.payWith)) + '</td><td><div class="row-actions">' + btn('Editar', 'editSender', { id: x.id }, 'sm') + btn('Quitar', 'deleteSender', { id: x.id }, 'sm danger') + '</div></td></tr>').join('') + '</tbody></table></div>' : '<div class="empty">Aún no registras remitentes. Agrega el correo con el que tu banco te avisa de cada cargo (por ejemplo notificaciones@banregio.com).</div>') +
      (unknown.length ? '<div class="small mt">Llegaron avisos de remitentes sin asociar: ' + unknown.map(f => '<b>' + esc(f) + '</b> ' + btn('Asociar', 'newSender', { from: f }, 'sm ghost')).join(' ') + '</div>' : '') + '</div>';
    if (done.length) h += '<div class="card glass mt"><div class="card-head"><h3>Procesados recientemente</h3></div>' + done.map(x => { const m = x.movementId && Data.get('movements', x.movementId);
      return '<div class="list-item"><div class="li-main"><div class="li-title">' + esc(x.merchant) + ' ' + (x.status === 'descartado' ? badge('Descartado', 'b-muted') : x.manual ? badge('Ya lo tenías registrado', 'b-violet') : x.auto ? badge('Automático', 'b-lime') : badge('Registrado', 'b-ok')) + '</div><div class="li-sub">' + fmtDate(x.date) + (m ? ' · ' + esc(m.category) + (m.recurringId ? ' · recurrente' : '') : '') + '</div></div><div class="li-right"><b class="num">' + money(x.amount) + '</b>' + btn(x.status === 'descartado' ? 'Recuperar' : x.manual ? 'Desvincular' : 'Anular', 'inboxRestore', { id: x.id }, 'sm ghost') + '</div></div>'; }).join('') + '</div>';

  },

  /* ---------------- RESUMEN (quincenal · semanal · mensual) ---------------- */
  resumen() {

    return head + (tab === 'semanal' ? this.resSemanal() : tab === 'mensual' ? this.resMensual() : this.resQuincenal());
  },
  resQuincenal() {
    const s = D().settings;
    if (!ui.flowStart) ui.flowStart = Calc.planningStart();
    let h = '<div class="section-head"><div><h2>Resumen quincenal</h2><p>Cada quincena financia sus compromisos. Los gastos marcados como <b>apartado</b> (renta, luz) se dividen entre las quincenas que los pagan: la quincena del ' + s.q2Day + ' empieza a financiar la renta siguiente.</p></div><div class="actions">' +
      btn(icon('left'), 'flowNav', { dir: '-1' }, 'sm') + btn('Actual', 'flowNav', { dir: '0' }, 'sm') + btn(icon('right'), 'flowNav', { dir: '1' }, 'sm') + '</div></div>';
    h += '<div class="card glass"><div class="card-head"><h3>Ajustes rápidos</h3><span class="sub">los cálculos se actualizan al escribir</span></div><div class="inline-fields">' +
      quickInput('q1Amount', 'Pago quincena 1 (día ' + s.q1Day + ')', s.q1Amount) + quickInput('q2Amount', 'Pago quincena 2 (día ' + s.q2Day + ')', s.q2Amount) + quickInput('food', 'Alimentación semanal (partida base)', Calc.foodWeeklyBase()) + '</div></div>';
    h += '<div id="flowCards">' + this.flowCards() + '</div>';
    return h;
  },
  flowCards() {
    const S1 = ui.flowStart, f1 = Calc.flowFor(S1), f2 = Calc.flowFor(addDays(f1.end, 1));
    let h = '<div class="grid g2 mt">' + flowCard(f1) + flowCard(f2) + '</div>';
    const t = today();
    const res = D().recurringExpenses.filter(r => r.active && r.reserve && Calc.isReservable(r));
    h += '<div class="card glass mt"><div class="card-head"><h3>Apartados activos</h3><span class="sub">acumulado al ' + fmtDate(t) + '</span></div><div class="table-wrap"><table><thead><tr><th>Concepto</th><th class="amt">Monto</th><th>Próximo pago</th><th>Quincenas que lo financian</th><th class="amt">Por quincena</th><th class="amt">Acumulado hoy</th></tr></thead><tbody>' +
      (res.length ? res.map(r => { const i = Calc.reserveInfo(r, t); if (!i) return '<tr><td>' + esc(r.name) + '</td><td class="amt">' + money(r.amount) + '</td><td colspan="4" class="muted">Sin próximos vencimientos</td></tr>'; return '<tr><td>' + esc(r.name) + '</td><td class="amt">' + money(r.amount) + '</td><td>' + fmtDate(i.nextDue) + '</td><td class="small">' + (i.funding || []).map(fmtDateS).join(', ') + '</td><td class="amt">' + money(i.perQ) + '</td><td class="amt"><b>' + money(i.accumulated) + '</b> <span class="muted small">(' + i.k + '/' + i.n + ')</span></td></tr>'; }).join('') : emptyRow(6, 'No hay gastos marcados como apartado. Actívalo en Salidas → Gastos recurrentes.')) +
      '</tbody></table></div></div>';
    return h;
  },
  resSemanal() {
    if (!ui.weekStart) ui.weekStart = Calc.weekStartOf(today());
    const w = Calc.weekFood(ui.weekStart), isCur = ui.weekStart === Calc.weekStartOf(today());
    const sm = Calc.periodSummary(w.start, w.end), bud = Calc.budget(w.start, w.end);
    let h = '<div class="section-head"><div><h2>Semana ' + fmtDateS(w.start) + ' – ' + fmtDate(w.end) + (isCur ? ' ' + badge('Semana actual', 'b-teal') : '') + '</h2><p>Consumo de la semana contra su presupuesto, movimientos y saldos.</p></div><div class="actions">' +
      btn(icon('left') + 'Anterior', 'weekNav', { dir: '-1' }, 'sm') + btn('Semana actual', 'weekNav', { dir: '0' }, 'sm') + btn('Siguiente' + icon('right'), 'weekNav', { dir: '1' }, 'sm') + btn('+ Gasto alimentación', 'newFood', { date: isCur ? today() : w.start }, 'primary') + '</div></div>';
    h += '<div class="grid g4">' + kpi('Presupuesto alimentación', money(w.budget)) + kpi('Gastado', money(w.spent), w.items.length + ' movimientos') + kpi('Disponible', money(w.available), w.daysLeft > 0 && w.available > 0 ? '≈ ' + money(w.available / w.daysLeft) + ' por día' : '', w.available < 0 ? 'bad' : 'ok') + kpi('Días restantes', String(w.daysLeft), 'de 7') + '</div>';
    h += '<div class="card glass mt"><div class="card-head"><h3>Consumido <span class="num" id="weekPct">' + pct(w.pct) + '</span></h3>' + badge(w.status.label, w.status.badge) + '</div>' + bar(w.pct, w.status.tone, true) +
      '<div class="legend mt"><span>' + badge('Normal', 'b-ok') + ' 0–70%</span><span>' + badge('Atención', 'b-warn') + ' 70–90%</span><span>' + badge('Riesgo', 'b-risk') + ' &gt;90%</span><span>' + badge('Excedido', 'b-bad') + ' &gt;100%</span></div></div>';
    h += '<div class="grid g2 mt"><div class="card glass"><div class="card-head"><h3>Movimientos y saldos de la semana</h3></div><div class="rows">' + summaryRows(sm) + '</div></div>';
    h += '<div class="card glass"><div class="card-head"><h3>Presupuesto de la semana</h3>' + btn('Planear en Presupuesto', 'goBudget', { mode: 'semana', date: w.start }, 'sm ghost') + '</div>' + miniBudget(bud) + '</div></div>';
    h += '<div class="card glass mt"><div class="card-head"><h3>Gastos de alimentación de la semana</h3><span class="sub">Otros gastos en la semana: ' + money(w.otherSpent) + '</span></div><div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Descripción</th><th>Cuenta</th><th class="amt">Monto</th><th></th></tr></thead><tbody>' +
      (w.items.length ? w.items.map(m => '<tr><td class="nowrap">' + fmtDateS(m.date) + '</td><td>' + esc(m.description) + (m.subcategory ? ' <span class="muted small">· ' + esc(m.subcategory) + '</span>' : '') + '</td><td>' + (m.creditDebtId ? 'Tarjeta' : esc(accName(m.account))) + '</td><td class="amt">' + money(m.amount) + '</td><td><div class="row-actions">' + btn('Editar', 'editMovement', { id: m.id }, 'sm') + btn('Eliminar', 'deleteMovement', { id: m.id }, 'sm danger') + '</div></td></tr>').join('') : emptyRow(5, 'Sin gastos de alimentación esta semana.')) +
      '</tbody></table></div></div>';
    return h;
  },
  resMensual() {
    const t = today();
    if (!/^\d{4}-\d{2}$/.test(ui.resMonth || '')) ui.resMonth = t.slice(0, 7);
    const ms = ui.resMonth + '-01', me = monthEnd(ms), sm = Calc.periodSummary(ms, me);
    let h = '<div class="section-head"><div><h2>Resumen mensual · ' + fmtMonth(ms) + '</h2><p>Movimientos y saldos del mes, desglosados por semana, por quincena y por cuenta.</p></div><div class="actions">' +
      btn(icon('left'), 'resMonthNav', { dir: '-1' }, 'sm') + '<label class="field" style="min-width:170px"><input type="month" id="resMonth" value="' + esc(ui.resMonth) + '" aria-label="Mes"></label>' + btn(icon('right'), 'resMonthNav', { dir: '1' }, 'sm') + '</div></div>';
    h += '<div class="grid g4">' + kpi('Saldo líquido inicial', money(sm.openLiquid), 'al ' + fmtDateS(addDays(ms, -1))) + kpi('Ingresos', money(sm.income), 'Ordinario ' + money(sm.ordinary) + (sm.extra ? ' · extra ' + money(sm.extra) : '')) +
      kpi('Egresos', money(r2(sm.spent + sm.debtPaid)), 'Gastos ' + money(sm.spent) + (sm.debtPaid ? ' · deudas ' + money(sm.debtPaid) : '') + (sm.saved ? ' · ahorro ' + money(sm.saved) : '')) +
      kpi('Saldo líquido final', money(sm.closeLiquid), (sm.closeLiquid - sm.openLiquid >= 0 ? '+' : '') + money(r2(sm.closeLiquid - sm.openLiquid)) + ' en el mes', sm.closeLiquid < sm.openLiquid ? 'warn' : 'ok') + '</div>';
    // Por semana
    const weeks = [];
    for (let ws = Calc.weekStartOf(ms); ws <= me; ws = addDays(ws, 7)) { const lo = ws < ms ? ms : ws, we = addDays(ws, 6), hi = we > me ? me : we; weeks.push(Calc.periodSummary(lo, hi)); }
    h += '<div class="card glass mt"><div class="card-head"><h3>Por semana</h3></div>' + periodTable(weeks, x => fmtDateS(x.start) + ' – ' + fmtDateS(x.end), 'mesSemanas') + '</div>';
    // Por quincena (quincenas que inician en el mes)
    const qs = Calc.paydaysBetween(ms, me).map(p => { const per = Calc.periodOf(p.date); return Object.assign(Calc.periodSummary(p.date, per.end), { expected: p.amount, q: p.q }); });
    h += '<div class="card glass mt"><div class="card-head"><h3>Por quincena</h3><span class="sub">quincenas que inician en el mes</span></div><div class="table-wrap"><table><thead><tr><th>Quincena</th><th class="amt">Esperado</th><th class="amt">Recibido</th><th class="amt">Desviación</th><th class="amt">Gastos</th><th class="amt">Deudas</th><th class="amt">Ahorro</th><th class="amt">Neto</th></tr></thead><tbody>' +
      (qs.length ? qs.map(x => { const dev = r2(x.income - x.expected); return '<tr><td class="nowrap">' + fmtDateS(x.start) + ' – ' + fmtDateS(x.end) + '</td><td class="amt">' + money(x.expected) + '</td><td class="amt">' + money(x.income) + '</td><td class="amt ' + (x.income ? (dev < 0 ? 'neg' : 'pos') : 'muted') + '">' + (x.income ? money(dev, true) : '—') + '</td><td class="amt">' + money(x.spent) + '</td><td class="amt">' + money(x.debtPaid) + '</td><td class="amt">' + money(x.saved) + '</td><td class="amt ' + (x.net < 0 ? 'neg' : 'pos') + '">' + money(x.net, true) + '</td></tr>'; }).join('') : emptyRow(8, 'Sin quincenas en el mes.')) + '</tbody></table></div></div>';
    // Por cuenta
    const fl = Calc.accountFlows(ms, me);
    h += '<div class="grid g2 mt"><div class="card glass"><div class="card-head"><h3>Saldos por cuenta</h3></div><div class="table-wrap"><table><thead><tr><th>Cuenta</th><th class="amt">Inicial</th><th class="amt">Entradas</th><th class="amt">Salidas</th><th class="amt">Final</th></tr></thead><tbody>' +
      fl.map(x => '<tr><td>' + esc(x.acc.name) + '<div class="tiny muted">' + ACC_TYPE_LABEL[x.acc.type] + '</div></td><td class="amt">' + money(x.open) + '</td><td class="amt pos">' + money(x.inflow) + '</td><td class="amt">' + money(x.outflow) + '</td><td class="amt"><b>' + money(x.close) + '</b></td></tr>').join('') + '</tbody></table></div>' +
      (sm.cardSpent ? '<p class="small muted">Compras con tarjeta en el mes: ' + money(sm.cardSpent) + ' (aumentan la deuda, no salen de cuentas).</p>' : '') + '</div>';
    h += '<div class="card glass"><div class="card-head"><h3>Presupuesto del mes</h3>' + btn('Ver en Presupuesto', 'goBudget', { mode: 'mes', date: ms }, 'sm ghost') + '</div>' + miniBudget(Calc.budget(ms, me)) + '</div></div>';
    return h;
  },

      (ui.budMode === 'semana' ? '<div class="field auto"><span class="lbl">Semana</span><div class="week-picker">' + btn(icon('left'), 'budNav', { dir: '-1' }, 'sm') + '<span class="week-label">' + fmtDateS(ws) + ' – ' + fmtDateS(addDays(ws, 6)) + '</span>' + btn(icon('right'), 'budNav', { dir: '1' }, 'sm') + '</div></div><label class="field" style="max-width:200px"><span class="lbl">Ir a la semana del</span><input type="date" id="budWeek" value="' + esc(ui.budWeek) + '"></label>' : '') +

      (parts_.length ? parts_.map(p => { const nOv = Object.keys(p.overrides || {}).length; return '<tr data-pid="' + esc(p.id) + '"><td><b>' + esc(p.category) + '</b></td><td>' + (p.period === 'semanal' ? 'Semana' : 'Mes') + '</td><td class="amt">' + money(p.amount) + '</td><td class="amt muted">' + money(p.period === 'semanal' ? p.amount * 52 / 12 : p.amount) + '</td><td>' + (nOv ? badge(nOv + (nOv === 1 ? ' periodo ajustado' : ' periodos ajustados'), 'b-violet') : '<span class="muted small">—</span>') + '</td><td class="small muted">' + esc(p.notes || '') + '</td><td><div class="row-actions">' + btn('Editar', 'editPartida', { id: p.id }, 'sm') + btn('Eliminar', 'deletePartida', { id: p.id }, 'sm danger') + '</div></td></tr>'; }).join('') : emptyRow(7, 'Sin partidas. Crea una para planear tu consumo variable.')) + '</tbody></table></div></div>';

  budRange() {

        '<div class="stat-grid"><div>Ahorrado<b class="num goal-saved">' + money(st.saved) + '</b></div><div>Faltante<b class="num">' + money(st.left) + '</b></div><div>Sugerido / quincena<b class="num">' + money(st.suggested) + '</b></div><div>Próximo pago<b class="num">' + (ps.next ? money(ps.next.amount) + ' · ' + fmtDateS(ps.next.dueDate) : '—') + '</b></div></div>' +
        '<div class="actions">' + btn('Abrir', 'openGoal', { id: g.id }, 'sm primary') + btn('Aportar', 'contribute', { id: g.id }, 'sm') + btn('Editar', 'editGoal', { id: g.id }, 'sm') + '</div></div>';

  /* ---------------- REPORTES ---------------- */
  reportes() {
    const t = today();
    if (!ui.repMonth) ui.repMonth = t.slice(0, 7);
    const months = [];
    for (let i = 5; i >= 0; i--) months.push(addMonthsStart(monthStart(t), -i));
    let h = '<div class="section-head"><div><h2>Reportes</h2><p>Resumen mensual de ingresos (ordinarios y extraordinarios), gastos, ahorro y desviaciones.</p></div><div class="actions">' + btn(icon('down') + 'Exportar movimientos (CSV)', 'exportCsv') + '</div></div>';
    h += '<div class="card glass"><div class="card-head"><h3>Últimos 6 meses</h3></div><div class="table-wrap"><table><thead><tr><th>Mes</th><th class="amt">Ingreso ordinario</th><th class="amt">Extraordinario</th><th class="amt">Desv. quincenas</th><th class="amt">Gastos</th><th class="amt">Pagos deuda</th><th class="amt">Ahorro</th><th class="amt">Flujo neto</th></tr></thead><tbody>' +
      months.map(ms => {
        const me = monthEnd(ms), inc = Calc.movementsIn(ms, me, m => m.type === 'ingreso');
        const ord = sum(inc, m => m.incomeKind === 'quincena' ? m.ordinary : (m.incomeKind === 'extra' ? 0 : m.amount)), ex = sum(inc, m => m.extraordinary || 0), dev = sum(inc.filter(m => m.incomeKind === 'quincena'), m => m.deviation);
        const g = sum(Calc.movementsIn(ms, me, m => m.type === 'gasto'), m => m.amount), dp = sum(Calc.movementsIn(ms, me, m => m.type === 'pago_deuda'), m => m.amount), sv = sum(Calc.movementsIn(ms, me, m => m.type === 'ahorro'), m => m.amount);
        const net = r2(ord + ex - g - dp - sv);
        return '<tr><td>' + fmtMonth(ms) + '</td><td class="amt">' + money(ord) + '</td><td class="amt pos">' + money(ex) + '</td><td class="amt ' + (dev < 0 ? 'neg' : '') + '">' + money(dev, true) + '</td><td class="amt">' + money(g) + '</td><td class="amt">' + money(dp) + '</td><td class="amt">' + money(sv) + '</td><td class="amt ' + (net < 0 ? 'neg' : 'pos') + '">' + money(net, true) + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
    const ms = ui.repMonth + '-01', me = monthEnd(ms);
    const cats = {};
    Calc.movementsIn(ms, me, m => m.type === 'gasto').forEach(m => { cats[m.category] = r2((cats[m.category] || 0) + m.amount); });
    const arr = Object.keys(cats).map(k => [k, cats[k]]).sort((a, b) => b[1] - a[1]), max = arr.length ? arr[0][1] : 0, tot = sum(arr, x => x[1]);
    h += '<div class="card glass mt"><div class="card-head"><h3>Gastos por categoría</h3><label class="field" style="max-width:200px"><input type="month" id="repMonth" value="' + esc(ui.repMonth) + '"></label></div>' +
      (arr.length ? arr.map((x, i) => '<div class="hbar"><span>' + esc(x[0]) + '</span>' + bar(max ? x[1] / max : 0, ['teal', 'violet', 'slate', 'warn'][i % 4]) + '<span class="right num">' + money(x[1]) + ' <span class="muted tiny">' + pct(tot ? x[1] / tot : 0) + '</span></span></div>').join('') : '<div class="empty">Sin gastos en ' + fmtMonth(ms) + '.</div>') + '</div>';
    const acc = Calc.balances();
    h += '<div class="card glass mt"><div class="card-head"><h3>Saldos por cuenta</h3><span class="sub">saldo inicial + movimientos</span></div>' + D().accounts.map(a => '<div class="list-item"><div class="li-main"><div class="li-title">' + esc(a.name) + '</div><div class="li-sub">' + ACC_TYPE_LABEL[a.type] + '</div></div><b class="num ' + (acc[a.id] < 0 ? 'neg' : '') + '">' + money(acc[a.id] || 0) + '</b></div>').join('') + '</div>';
    return h;
  },

/* --- Primeros pasos (checklist en el Dashboard) --- */
function setupSteps() {
  const d = D(), st = d.meta.setup || {};
  return [
    { key: 'balances', done: d.accounts.some(a => Number(a.initialBalance) > 0), title: 'Captura el saldo de tus cuentas', sub: 'Saldo al ' + fmtDate(d.settings.startDate) + ' (fecha de inicio).', target: 'config', auto: true },
    { key: 'income', done: !!st.income, title: 'Confirma montos y días de tus quincenas', sub: 'Configuración → Guardar y recalcular.', target: 'config' },
    { key: 'recurring', done: !!st.recurring, title: 'Revisa tus gastos recurrentes', sub: 'Salidas → montos, días de pago y apartados.', target: 'recurrentes' },
    { key: 'debts', done: !!st.debts, title: 'Confirma saldo actual y fecha límite de tus deudas', sub: 'Salidas → Deudas.', target: 'deudas' },
    { key: 'budget', done: !!st.budget, title: 'Define tus partidas de presupuesto', sub: 'Alimentación y otros consumos por semana o mes.', target: 'presupuesto' },
    { key: 'mail', done: Bank.configured() && (D().senders || []).length > 0, title: 'Conecta tu correo y registra los remitentes de tus bancos', sub: 'Bandeja → Conectar correo, luego “Agregar remitente” con su cuenta o tarjeta. O pega la notificación en la Bandeja.', target: 'bandeja', auto: true },
    { key: 'goals', done: !!st.goals, title: 'Revisa tus metas y el calendario del viaje', sub: 'El calendario precargado es una estimación de $58,978.', target: 'viaje' }
  ];
}
function setupCard() {
  const st = D().meta.setup || {}, steps = setupSteps(), done = steps.filter(x => x.done).length;
  if (st.hidden || done === steps.length) return '';
  return '<div class="card glass" style="margin-bottom:20px;border-color:rgba(95,202,185,.3)"><div class="card-head"><h3>Primeros pasos · ' + done + ' de ' + steps.length + '</h3><div class="actions">' + btn('Ver guía', 'goto', { target: 'guia' }, 'sm') + btn('Ocultar', 'setupHide', {}, 'sm ghost') + '</div></div>' + bar(done / steps.length, 'teal') +
    '<div class="mt">' + steps.map((x, i) => '<div class="list-item"><div class="li-main" style="display:flex;gap:12px;align-items:flex-start"><span class="badge ' + (x.done ? 'b-ok' : 'b-muted') + '" style="min-width:28px;justify-content:center">' + (x.done ? icon('check') : (i + 1)) + '</span><div><div class="li-title" style="white-space:normal' + (x.done ? ';opacity:.6' : '') + '">' + x.title + '</div><div class="li-sub">' + x.sub + '</div></div></div><div class="li-right">' + (x.done ? '' : btn('Ir', 'goto', { target: x.target }, 'sm') + (x.auto ? '' : btn('Listo', 'setupDone', { key: x.key }, 'sm primary'))) + '</div></div>').join('') + '</div></div>';

/* --- Alertas: registrar lo real en días de cobro y pago --- */
function alertsCard() {
  const al = Calc.alerts();
  if (!al.length) return '';
  return '<div class="card glass alert-card" id="alertsCard"><div class="card-head"><h3>' + icon('bell') + ' Registra lo real · ' + al.length + '</h3><span class="sub">en días de cobro y pago captura el monto real para compararlo con lo programado</span></div>' +
    al.slice(0, 8).map(a => '<div class="list-item" data-alert="' + esc(a.key) + '"><div class="li-main"><div class="li-title" style="white-space:normal"><span class="dot ' + (a.kind === 'cobro' ? 'k-ingreso' : 'k-alert') + '"></span> ' + esc(a.title) + '</div><div class="li-sub">' + fmtDateL(a.date) + ' · ' + esc(a.sub) + '</div></div><div class="li-right">' + btn(a.action === 'confirmMov' ? 'Confirmar' : 'Registrar', a.action, a.data, 'sm primary') + (a.skip ? btn('No aplica', 'skipOcc', a.data, 'sm ghost') : '') + '</div></div>').join('') +
    (al.length > 8 ? '<div class="small muted mt">y ' + (al.length - 8) + ' pendientes más (revisa Presupuesto → Cobros y pagos).</div>' : '') + '</div>';
}

/* --- Franja superior: días de la semana en curso --- */
function weekStrip(wsArg) {
  const t = today(), ws = wsArg || Calc.weekStartOf(t), we = addDays(ws, 6);
  const ev = Calc.eventsBetween(ws, we), al = Calc.alerts(t);
  let h = '<div class="wstrip" role="list" aria-label="Semana en curso">';
  for (let i = 0; i < 7; i++) {
    const ds = addDays(ws, i), list = ev.filter(e => e.date === ds && !e.info), pend = al.some(a => a.date === ds);
    const spent = sum(Calc.movementsIn(ds, ds, m => m.type === 'gasto'), m => m.amount);
    h += '<button type="button" role="listitem" class="wday' + (ds === t ? ' today' : '') + (ds < t ? ' past' : '') + '" data-action="dayDetail" data-date="' + ds + '"' + (ds === t ? ' aria-current="date"' : '') + ' title="' + esc(fmtDateL(ds)) + '">' +
      '<span class="wd-name">' + DIAS_C[dow(ds)] + '</span><span class="wd-num">' + parts(ds).d + '</span>' +
      '<span class="dots">' + list.slice(0, 4).map(e => '<i class="dot k-' + e.kind + (e.paid ? ' done' : '') + (e.plannedDate ? ' moved' : '') + '"' + (e.shiftLabel ? ' title="' + esc(e.title + ' · ' + e.shiftLabel) + '"' : '') + '></i>').join('') + (pend ? '<i class="dot k-alert"></i>' : '') + '</span>' +
      '<span class="wd-amt num">' + (spent > 0 ? '−' + moneyShort(spent) : (ds === t ? 'Hoy' : '&nbsp;')) + '</span></button>';
  }
  return h + '</div>';
}

/* --- Calendario reutilizable (Dashboard y sección Calendario) --- */
function calLegend() { return '<div class="legend"><span><i class="dot k-ingreso"></i>Ingreso</span><span><i class="dot k-renta"></i>Renta</span><span><i class="dot k-servicio"></i>Servicios</span><span><i class="dot k-recurrente"></i>Otros recurrentes</span><span><i class="dot k-deuda"></i>Deudas</span><span><i class="dot k-viaje"></i>Viaje</span><span><i class="dot k-meta"></i>Metas</span><span><i class="dot k-alert"></i>Por registrar</span><span><i class="dot k-ingreso moved"></i>Registrado en otra fecha (adelanto o atraso)</span></div>'; }
function calGrid(start, cells, refMonth, selDate, action, tall) {
  const t = today(), ws = Number(D().settings.weekStart) || 0, end = addDays(start, cells - 1);
  const ev = Calc.eventsBetween(start, end), al = Calc.alerts(t), byDay = {};
  ev.forEach(e => { (byDay[e.date] = byDay[e.date] || []).push(e); });
  let h = '<div class="cal-grid' + (tall ? ' tall' : '') + '">';
  for (let i = 0; i < 7; i++) h += '<div class="cal-dow">' + DIAS_C[(ws + i) % 7] + '</div>';
  for (let i = 0; i < cells; i++) {
    const ds = addDays(start, i), list = byDay[ds] || [], pend = al.some(a => a.date === ds);
    const out = sum(list.filter(e => e.kind !== 'ingreso' && e.amount && !e.info), e => e.amount);
    h += '<button type="button" class="cal-day' + (refMonth && ds.slice(0, 7) !== refMonth.slice(0, 7) ? ' out' : '') + (ds === t ? ' today' : '') + (ds === selDate ? ' sel' : '') + '" data-action="' + action + '" data-date="' + ds + '"><span class="dn">' + (tall ? DIAS_C[dow(ds)] + ' ' : '') + parts(ds).d + '</span><span class="dots">' + list.slice(0, 6).map(e => '<i class="dot k-' + e.kind + (e.paid ? ' done' : '') + (e.plannedDate ? ' moved' : '') + '" title="' + esc(e.title + (e.shiftLabel ? ' · ' + e.shiftLabel : '')) + '"></i>').join('') + (pend ? '<i class="dot k-alert" title="Por registrar"></i>' : '') + '</span>' + (out > 0 ? '<span class="camt num">' + money(out) + '</span>' : '') + (tall ? list.slice(0, 3).map(e => '<span class="cal-ev">' + esc(e.title) + '</span>').join('') : '') + '</button>';
  }
  return h + '</div>';
}
// Diferencia entre lo estimado y lo registrado. Ingreso: cobrar de más es superávit. Gasto: pagar de menos es superávit.
function planVsRealCell(planned, real, income) {
  if (real == null) return '<div class="pr-grid"><div><span>Estimado</span><b class="num">' + money(planned) + '</b></div><div><span>Registrado</span><b class="num muted">—</b></div><div><span>Diferencia</span><b class="muted">Pendiente</b></div></div>';
  const diff = r2(income ? real - planned : planned - real), p = planned > 0 ? diff / planned : null;
  const cls = Math.abs(diff) < 0.005 ? 'eq' : diff > 0 ? 'pos' : 'neg';
  const lbl = cls === 'eq' ? 'Exacto' : (diff > 0 ? 'Superávit' : 'Déficit');
  return '<div class="pr-grid"><div><span>Estimado</span><b class="num">' + money(planned) + '</b></div><div><span>Registrado</span><b class="num">' + money(real) + '</b></div><div class="pr-diff ' + cls + '"><span>' + lbl + '</span><b class="num">' + (cls === 'eq' ? money(0) : money(diff, true)) + '</b><small class="num">' + (cls === 'eq' ? 'exacto' : (p != null ? (diff > 0 ? '+' : '') + pct(p) : '')) + '</small></div></div>';
}
function dayDetailHtml(ds) {
  const all = Calc.eventsBetween(ds, ds, { ghosts: true }), ev = all.filter(e => !e.ghost), ghosts = all.filter(e => e.ghost), mv = Calc.movementsIn(ds, ds);
  const linked = new Set(ev.map(e => e.movId).filter(Boolean));
  const free = mv.filter(m => !linked.has(m.id));
  const money_ev = ev.filter(e => !e.info && e.amount != null);
  let h = '<div class="card-head"><h3>' + fmtDateL(ds) + '</h3><span class="sub">' + money_ev.length + ' programados · ' + mv.length + ' registrados</span></div>';
  h += money_ev.length ? money_ev.map(e => {
    const isDebt = e.kind === 'deuda';
    const pm = e.movId ? D().movements.find(x => x.id === e.movId) : null, pendM = pm && !Calc.isReal(pm);
    const status = pendM ? badge('Registrado · ' + (e.income ? 'por cobrar' : 'por pagar'), 'b-warn') + btn('Confirmar', 'confirmMov', { id: pm.id }, 'sm primary') : e.paid ? badge(e.income ? 'Cobrado' : 'Pagado', 'b-ok') : (e.action && e.amount > 0 ? btn(isDebt ? 'Abonar' : 'Registrar', e.action, { id: e.id, date: e.date }, 'sm' + (ds <= today() ? ' primary' : '')) : '');
    const undo = e.movId ? btn('Editar', 'editMovement', { id: e.movId }, 'sm ghost') : '';
    return '<div class="pr-row"><div class="pr-top"><div class="li-title"><span class="dot k-' + e.kind + '"></span> ' + esc(e.title) + (e.shiftLabel ? ' ' + badge(e.shiftLabel, 'b-violet') : '') + '</div><div class="li-right">' + undo + status + '</div></div>' +
      (isDebt ? '<div class="pr-grid"><div><span>Saldo pendiente</span><b class="num">' + money(e.amount) + '</b></div></div>' : planVsRealCell(e.amount, e.real, !!e.income)) + '</div>';
  }).join('') : '<div class="empty" style="padding:14px">Sin cobros ni pagos programados este día.</div>';
  // Totales del día (solo cobros y pagos programados)
  const prog = money_ev.filter(e => e.kind !== 'deuda');
  if (prog.length) {
    const inP = sum(prog.filter(e => e.income), e => e.amount), outP = sum(prog.filter(e => !e.income), e => e.amount);
    const done = prog.filter(e => e.real != null);
    const inR = sum(done.filter(e => e.income), e => e.real), outR = sum(done.filter(e => !e.income), e => e.real);
    const netP = r2(inP - outP), netR = r2(inR - outR), inPd = sum(done.filter(e => e.income), e => e.amount), outPd = sum(done.filter(e => !e.income), e => e.amount);
    h += '<div class="pr-total"><div class="li-title">Balance del día · neto</div>' + planVsRealCell(netP, done.length ? r2(netR + (inP - inPd) - (outP - outPd)) : null, true) + '<div class="tiny muted">Ingresos menos pagos programados del día. Lo pendiente se cuenta con su monto estimado; no incluye lo registrado sin programar.</div></div>';
  }
  if (ghosts.length) h += '<div class="small muted mt">Programado para este día, registrado en otra fecha</div>' + ghosts.map(g => '<div class="list-item"><div class="li-main"><div class="li-title"><span class="dot k-' + g.kind + ' done"></span> ' + esc(g.title) + '</div><div class="li-sub">' + (g.income ? 'Cobrado' : 'Pagado') + ' el ' + fmtDateL(g.movedTo) + ' · ' + (g.shift < 0 ? Math.abs(g.shift) + (g.shift === -1 ? ' día antes' : ' días antes') : g.shift + (g.shift === 1 ? ' día después' : ' días después')) + '</div></div><div class="li-right">' + btn('Ver día', 'dayDetail', { date: g.movedTo }, 'sm ghost') + '</div></div>').join('');
  if (free.length) h += '<div class="small muted mt">Registrado sin programar</div>' + free.map(m => '<div class="list-item"><div class="li-main"><div class="li-title">' + badge(TYPE_LABEL[m.type], TYPE_BADGE[m.type]) + ' ' + esc(m.description) + '</div><div class="li-sub">' + esc(m.category) + (Calc.isReal(m) ? '' : ' · ' + badge(m.type === 'ingreso' ? 'Por cobrar' : 'Por pagar', 'b-warn')) + '</div></div><div class="li-right"><b class="num">' + money(m.amount) + '</b>' + (Calc.isReal(m) ? '' : btn('Confirmar', 'confirmMov', { id: m.id }, 'sm primary')) + btn('Editar', 'editMovement', { id: m.id }, 'sm ghost') + '</div></div>').join('');
  h += '<div class="actions mt">' + btn(icon('plus') + 'Movimiento en este día', 'newMovementOn', { date: ds }, 'sm primary') + '</div>';
  return h;
}

/* --- Tarjeta de flujo quincenal --- */
function flowCard(f) {
  const t = today(), cur = t >= f.start && t <= f.end;
  let h = '<div class="flow-card glass" data-flow="' + f.start + '"><div class="card-head"><div><h3>Quincena ' + fmtDateS(f.start) + ' → ' + fmtDate(f.end) + '</h3><span class="sub">' + f.days + ' días · pago del día ' + parts(f.start).d + '</span></div>' + (cur ? badge('En curso', 'b-teal') : (f.end < t ? badge('Cerrada', 'b-muted') : badge('Próxima', 'b-info'))) + '</div><div class="rows">';
  h += row('INGRESO', '<span class="pos flow-income">' + money(f.income) + '</span>');
  h += row('Apartados', money(-f.tot.apart)); f.apart.forEach(x => { h += sub('Apartado ' + x.name.toLowerCase(), money(-x.amount)); });
  h += row('Alimentación', money(-f.tot.food)); h += sub('Partida semanal ' + money(Calc.foodWeeklyBase()) + ' prorrateada a ' + f.days + ' días', '');
  if (f.tot.partidas > 0) { h += row('Otras partidas', money(-f.tot.partidas)); f.partidas.forEach(x => { h += sub(x.name, money(-x.amount)); }); }
  h += row('Servicios', money(-f.tot.services)); f.services.forEach(x => { h += sub(x.name + ' (' + fmtDateS(x.date) + ')', money(-x.amount)); });
  h += row('Metas y viaje', money(-f.tot.goals)); f.goalPays.forEach(x => { h += sub(x.name + (x.paid ? ' ✓' : ''), money(-x.amount)); }); f.goalSaves.forEach(x => { h += sub(x.name, money(-x.amount)); });
  h += row('Deudas', money(-f.tot.debts)); f.debts.forEach(x => { h += sub(x.name, money(-x.amount)); });
  h += row('Otros compromisos', money(-f.tot.others)); f.others.forEach(x => { h += sub(x.name + ' (' + fmtDateS(x.date) + ')', money(-x.amount)); });
  h += row('Total compromisos', money(-f.total), 'total');
  h += '</div><div class="flow-ds ' + (f.safe < 0 ? 'bad' : f.safe < f.income * 0.05 ? 'warn' : '') + '"><span><b>DISPONIBLE SEGURO</b><br><span class="small muted">' + (f.safe < 0 ? 'Faltan recursos para cubrir los compromisos' : 'libre después de compromisos') + '</span></span><span class="v num flow-safe">' + money(f.safe) + '</span></div>';
  const dev = f.real.quincena ? r2(f.real.quincena - f.income) : null;
  h += '<div class="flow-real"><div>Ingreso recibido<b class="num">' + money(f.real.income) + '</b>' + (dev != null ? '<span class="' + (dev < 0 ? 'neg' : dev > 0 ? 'pos' : '') + '">' + (dev === 0 ? 'según lo esperado' : 'desv. ' + money(dev, true)) + '</span>' : (f.start <= t ? '<span class="warn-t">Quincena sin registrar</span>' : '')) + '</div><div>Gastado real<b class="num">' + money(f.real.spent) + '</b></div><div>Ahorrado real<b class="num">' + money(f.real.saved) + '</b></div></div>';
  return h + '</div>';
}

    const lines = [cols.join(',')].concat(D().movements.slice().sort((a, b) => a.date < b.date ? -1 : 1).map(m => [m.date, TYPE_LABEL[m.type], m.category, m.subcategory, m.description, accName(m.account), m.toAccount ? accName(m.toAccount) : '', m.method, m.amount, m.ordinary != null ? m.ordinary : '', m.extraordinary != null ? m.extraordinary : '', m.notes].map(q).join(',')));
    if (download('niw_movimientos_' + today() + '.csv', '\ufeff' + lines.join('\r\n'), 'text/csv;charset=utf-8')) Toast.show('CSV exportado', 'ok');
  },
  icsText(opt) {
    const d = D(), s = d.settings, now = new Date(), stamp = now.getUTCFullYear() + p2(now.getUTCMonth() + 1) + p2(now.getUTCDate()) + 'T' + p2(now.getUTCHours()) + p2(now.getUTCMinutes()) + p2(now.getUTCSeconds()) + 'Z';
    const e = x => String(x == null ? '' : x).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
    const dt = x => x.replace(/-/g, '');
    const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//NIW//Calendario financiero//ES', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Mi Finanzas', 'X-WR-TIMEZONE:America/Mexico_City'];
    let count = 0;
    const ev = (id, date, summary, desc, rrule) => {
      count++;
      L.push('BEGIN:VEVENT', 'UID:' + id + '@mi-finanzas', 'DTSTAMP:' + stamp, 'DTSTART;VALUE=DATE:' + dt(date), 'DTEND;VALUE=DATE:' + dt(addDays(date, 1)), 'SUMMARY:' + e(summary));
      if (desc) L.push('DESCRIPTION:' + e(desc));
      if (rrule) L.push('RRULE:' + rrule);
      L.push('TRANSP:TRANSPARENT');
      if (opt.alarm >= 0) L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + e(summary), 'TRIGGER:' + (opt.alarm === 0 ? 'PT9H' : '-P' + opt.alarm + 'D'), 'END:VALARM');
      L.push('END:VEVENT');
    };
    const start = s.startDate > today() ? s.startDate : today();
    if (opt.income) {
      [[1, s.q1Day, s.q1Amount], [2, s.q2Day, s.q2Amount]].forEach(([q, day, amt]) => {
        const first = Calc.paydaysBetween(start, addDays(start, 45)).find(p => p.q === q);
        if (first) ev('ingreso-q' + q, first.date, 'Ingreso quincena ' + q + ' · ' + money(amt), 'Pago quincenal esperado', 'FREQ=MONTHLY;BYMONTHDAY=' + day);
      });
    }
    if (opt.recurring) d.recurringExpenses.filter(r => r.active).forEach(r => {
      const first = Calc.occurrences(r, start, addDays(start, 800))[0];
      if (!first) return;
      let rr;
      const until = r.endDate && isDate(r.endDate) ? ';UNTIL=' + dt(r.endDate) : '';
      if (MONTH_FREQ[r.frequency]) rr = 'FREQ=MONTHLY;INTERVAL=' + MONTH_FREQ[r.frequency] + ';BYMONTHDAY=' + Math.min(r.payDay, 28 < r.payDay ? 28 : r.payDay);
      else if (r.frequency === 'quincenal') { const d2 = r.payDay + 15 > 30 ? r.payDay - 15 : r.payDay + 15; rr = 'FREQ=MONTHLY;BYMONTHDAY=' + Math.min(r.payDay, d2) + ',' + Math.max(r.payDay, d2); }
      else if (r.frequency === 'semanal') rr = 'FREQ=WEEKLY';
      else rr = 'FREQ=DAILY;INTERVAL=' + (r.customDays || 30);
      ev('rec-' + r.id, first, r.name + ' · ' + money(r.amount), r.category + (r.payDayTo ? ' · pagar entre el día ' + r.payDay + ' y ' + r.payDayTo : '') + (r.reserve ? ' · se aparta en quincenas' : '') + (r.notes ? ' · ' + r.notes : ''), rr + until);
    });
    if (opt.trip) {
      d.goalPayments.filter(p => !Calc.isPayDone(p)).forEach(p => { const g = Calc.goal(p.goalId); ev('gp-' + p.id, p.dueDate, (g && g.kind === 'viaje' ? 'Pago viaje' : 'Pago meta') + ' · ' + money(p.amount), (g ? g.name : '') + (p.notes ? ' · ' + p.notes : '')); });
    }
    if (opt.debts) d.debts.forEach(db => { const c = Calc.debtCurrent(db); if (c > 0.004 && isDate(db.dueDate)) ev('debt-' + db.id, db.dueDate, 'Fecha límite deuda · ' + db.name, 'Saldo pendiente: ' + money(c)); });
    if (opt.goals) d.goals.filter(g => isDate(g.date)).forEach(g => ev('goal-' + g.id, g.date, 'Fecha objetivo · ' + g.name, Calc.goalType(g).label + ' · ahorro objetivo ' + money(g.target)));
    // Recordatorios para registrar lo real en días de cobro (análisis vs presupuesto)
    if (opt.income) [[1, s.q1Day], [2, s.q2Day]].forEach(([q, day]) => {
      const first = Calc.paydaysBetween(start, addDays(start, 45)).find(p => p.q === q);
      if (first) ev('registro-q' + q, first.date, 'Registrar cobro real · quincena ' + q, 'Abre NIW y registra lo que recibiste y lo que pagaste hoy para compararlo con el presupuesto.', 'FREQ=MONTHLY;BYMONTHDAY=' + day);
    });
    L.push('END:VCALENDAR');
    const fold = l => { if (l.length <= 74) return l; let out = '', i = 0; while (i < l.length) { out += (i ? '\r\n ' : '') + l.slice(i, i + (i ? 73 : 74)); i += i ? 73 : 74; } return out; };
    return { text: L.map(fold).join('\r\n') + '\r\n', count };
  },
  ics() {
    const g = id => { const el = $(id); return el ? el.checked : true; };
    const al = $('icsAlarm') ? Number($('icsAlarm').value) : 1;
    const res = this.icsText({ income: g('icsIncome'), recurring: g('icsRecurring'), trip: g('icsTrip'), debts: g('icsDebts'), goals: g('icsGoals'), alarm: al });
    if (!res.count) { Toast.show('No hay eventos para exportar con esas opciones', 'warn'); return; }
    if (download('niw_calendario.ics', res.text, 'text/calendar;charset=utf-8')) {
      Toast.show('Calendario exportado · ' + res.count + ' eventos', 'ok');
      if ($('icsInfo')) $('icsInfo').textContent = 'Último archivo: ' + res.count + ' eventos (' + fmtDateL(today()) + ').';
    }
  },
  importFile(file) {
    if (!file) return;
    if (file.size > 20 * 1024 * 1024) { Toast.show('El archivo es demasiado grande', 'err'); return; }
    const reader = new FileReader();
    reader.onerror = () => Toast.show('No se pudo leer el archivo', 'err');
    reader.onload = () => {
      let obj;
      try { obj = JSON.parse(String(reader.result)); } catch (e) { Toast.show('El archivo no es un JSON válido', 'err'); return; }
      const err = Schema.structure(obj);
      if (err) { Toast.show('Respaldo inválido: ' + err, 'err'); return; }
      const n = obj.movements.length;
      Confirm.ask({ title: 'Importar respaldo', message: 'Contiene ' + n + ' movimientos, ' + obj.recurringExpenses.length + ' gastos recurrentes, ' + obj.debts.length + ' deudas y ' + obj[Schema.payCollection(obj)].length + ' pagos programados.\nReemplazará todos los datos actuales.', confirm: 'Importar y reemplazar', danger: true }).then(ok => { if (ok) Exporter.applyImport(obj); });
    };
    reader.readAsText(file);
  },
  applyImport(obj) {
    try {
      const prev = JSON.stringify(D());
      Store.replace(Schema.migrate(obj));
      resetUi(); App.render();
      Toast.show('Respaldo importado correctamente', 'ok', { label: 'Deshacer', fn: () => { Store.replace(Schema.migrate(JSON.parse(prev))); App.render(); } });
    } catch (e) { console.error(e); Toast.show('No se pudo importar: ' + e.message, 'err'); }
  }
};
