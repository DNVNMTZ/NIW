/* =====================================================================
   SISTEMA VISUAL — NIW
   Carbón profundo + lima eléctrica + violeta. Tarjetas sólidas, píldoras,
   tipografía Outfit (display) y Manrope (interfaz y cifras).
   ===================================================================== */
:root{
  --ink:#19191E;
  --surface:#232329;
  --surface-2:#2D2D34;
  --surface-3:#37373F;
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.14);
  --text:#F3F3EE;
  --muted:#A3A2AD;
  --muted-2:#72717D;
  --lime:#D3F35B;
  --lime-2:#E4FB8E;
  --on-lime:#17180F;
  --violet:#6A45DF;
  --violet-2:#7E5CEB;
  --violet-d:rgba(122,90,236,.18);
  --lavender:#BDAEFF;
  --aqua:#86E3DB;
  --aqua-d:rgba(134,227,219,.14);
  --ok:#7EDFA4; --ok-d:rgba(126,223,164,.14);
  --warn:#FFC34D; --warn-d:rgba(255,195,77,.14);
  --risk:#FF9B57; --risk-d:rgba(255,155,87,.15);
  --bad:#FF6D63; --bad-d:rgba(255,109,99,.15);
  /* alias usados por el código existente */
  --teal:var(--aqua); --teal-d:var(--aqua-d); --slate:#9FB0C8; --slate-d:rgba(159,176,200,.14);
  --neon:var(--lime); --neon-d:rgba(211,243,91,.14);
  --r-xl:28px; --r:22px; --r-sm:14px;
  --side:248px;
  --display:'Outfit',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font:'Manrope',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--ink);color:var(--text);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
body.modal-open{overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.ic{width:18px;height:18px;flex:0 0 auto}
a{color:var(--lime)}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:500;font-size:26px;letter-spacing:-.02em;line-height:1.15}
h3{font-size:15.5px}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Superficies: sólidas, sin vidrio */
.glass{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

/* ===== Estructura ===== */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--side);padding:22px 14px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;z-index:40;background:#141418;border-right:1px solid var(--line);overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:2px 10px 14px}
.brand-mark{width:36px;height:36px;flex:none;display:block}
.brand .brand-word{display:block;line-height:0;margin:2px 0 6px}.brand .brand-word svg{height:17px;width:auto;display:block}
.brand b{display:block;font-family:var(--display);font-weight:500;font-size:17px;letter-spacing:-.01em}
.brand small{color:var(--muted-2);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-group{font-size:11.5px;color:var(--muted-2);padding:14px 12px 4px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:none;border-radius:999px;background:none;color:var(--muted);cursor:pointer;text-align:left;font-size:14px;font-weight:600;transition:background .15s,color .15s}
.nav-item:hover{background:var(--surface);color:var(--text)}
.nav-item.active{background:var(--lime);color:var(--on-lime)}
.nav-item.active .ic{color:var(--on-lime)}
.nav-count{margin-left:auto;min-width:21px;height:21px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.nav-item.active .nav-count{background:var(--on-lime);color:var(--lime)}
.side-foot{margin-top:auto;padding:12px;font-size:11.5px;color:var(--muted-2)}
.overlay{display:none}
.main-wrap{margin-left:var(--side);min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:14px 32px;padding-top:calc(14px + env(safe-area-inset-top));background:rgba(25,25,30,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.greet{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--aqua);color:#14302D;display:grid;place-items:center;font-family:var(--display);font-weight:500;font-size:16px;flex:0 0 auto}
.greet-text{min-width:0;line-height:1.2}
.greet-text small{display:block;color:var(--muted);font-size:12.5px}
.greet-text b{font-family:var(--display);font-weight:500;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#pageTitle{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.icon-btn.hamburger{display:none}
.top-ds{display:flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;white-space:nowrap}
.top-ds small{color:var(--muted);font-size:12px}
.top-ds b{font-size:15px}
.sim-badge{font-size:11.5px;padding:4px 10px;border-radius:999px;background:var(--warn-d);color:var(--warn)}
main{padding:20px 32px 120px;max-width:1320px;width:100%}

/* ===== Genéricos ===== */
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.section-head p{margin:6px 0 0;color:var(--muted);max-width:680px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mt{margin-top:14px}.mt2{margin-top:26px}
.card{padding:20px 22px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-head h3{font-size:16px;font-weight:700}
.card-head .sub{color:var(--muted);font-size:12.5px}
.muted{color:var(--muted)}
.small{font-size:12.5px}.tiny{font-size:11.5px}
.right{text-align:right}.nowrap{white-space:nowrap}
.pos{color:var(--ok)}.neg{color:var(--bad)}.warn-t{color:var(--warn)}
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi-label{color:var(--muted);font-size:13px;font-weight:600}
.kpi-value{font-family:var(--display);font-weight:500;font-size:28px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.kpi-sub{color:var(--muted);font-size:12.5px}
.kpi.hero{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.kpi.hero .kpi-label,.kpi.hero .kpi-sub{color:rgba(23,24,15,.68)}
.kpi.hero .kpi-value{color:var(--on-lime);font-size:32px}
.kpi.hero .link-btn{color:var(--on-lime);text-decoration:underline}
.kpi.hero.tone-bad{background:var(--bad);border-color:var(--bad)}
.kpi.hero.tone-warn{background:var(--warn);border-color:var(--warn)}
.kpi.tone-ok .kpi-value{color:var(--ok)}.kpi.tone-bad .kpi-value{color:var(--bad)}.kpi.tone-warn .kpi-value{color:var(--warn)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text);cursor:pointer;font-weight:700;font-size:13.5px;transition:background .15s,transform .05s;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.btn.primary:hover{background:var(--lime-2)}
.btn.violet{background:var(--violet);border-color:var(--violet);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{background:var(--bad-d);border-color:rgba(255,109,99,.35);color:#FFC9C4}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.cta{padding:6px 6px 6px 22px;gap:14px;font-size:14.5px}
.btn.cta .cta-ic{width:36px;height:36px;border-radius:50%;background:var(--on-lime);color:var(--lime);display:grid;place-items:center}
.icon-btn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;color:var(--text)}
.icon-btn:hover{background:var(--surface-2)}
.link-btn{background:none;border:none;color:var(--lime);cursor:pointer;padding:0;font-size:12.5px;font-weight:600}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.b-ok{background:var(--ok-d);color:var(--ok)}
.b-warn{background:var(--warn-d);color:var(--warn)}
.b-risk{background:var(--risk-d);color:var(--risk)}
.b-bad{background:var(--bad-d);color:var(--bad)}
.b-info{background:var(--slate-d);color:var(--slate)}
.b-violet{background:var(--violet-d);color:var(--lavender)}
.b-teal{background:var(--aqua-d);color:var(--aqua)}
.b-lime{background:var(--lime);color:var(--on-lime)}
.b-muted{background:var(--surface-2);color:var(--muted)}
.badge .ic{width:13px;height:13px}

.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.bar.lg{height:12px}
.bar>span{display:block;height:100%;border-radius:999px;background:var(--aqua);transition:width .3s}
.bar>span.t-ok{background:var(--ok)}.bar>span.t-warn{background:var(--warn)}.bar>span.t-risk{background:var(--risk)}.bar>span.t-bad{background:var(--bad)}.bar>span.t-violet{background:var(--violet-2)}.bar>span.t-slate{background:var(--slate)}.bar>span.t-teal{background:var(--aqua)}.bar>span.t-lime{background:var(--lime)}
.bar.striped{height:34px;border-radius:12px;background:repeating-linear-gradient(-45deg,#2A2A31 0 6px,#202026 6px 12px)}
.bar.striped>span{border-radius:12px;background:repeating-linear-gradient(-45deg,var(--violet-2) 0 6px,#5B38CF 6px 12px)}

.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted-2);font-size:12px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(255,255,255,.02)}
td.amt,th.amt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td .row-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}
tfoot td{font-weight:700;border-top:1px solid var(--line-2)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

.rows .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.rows .row:last-child{border-bottom:none}
.rows .row .lbl{color:var(--muted)}
.rows .row.sub{padding:3px 0 3px 14px;font-size:12.5px;border-bottom:none}
.rows .row.total{border-top:1px solid var(--line-2);border-bottom:none;margin-top:6px;padding-top:12px;font-weight:700}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field .lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.field .req{color:var(--lime);font-weight:700}
.field .hint{color:var(--muted-2);font-size:11.5px}
.field .err{color:var(--bad);font-size:12px}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--bad)}
.field.check{flex-direction:row;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0}
.field.check input{width:20px;height:20px;accent-color:var(--lime)}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=search],input[type=url],input[type=password],select,textarea{
  width:100%;padding:11px 16px;border-radius:16px;border:1px solid var(--line-2);background:var(--surface-2);outline:none;font-size:16px;min-height:46px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 20px,calc(100% - 15px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
input:focus,select:focus,textarea:focus{border-color:var(--lime);box-shadow:0 0 0 3px rgba(211,243,91,.18)}
textarea{resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.form-grid .full{grid-column:1/-1}
.inline-fields{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.inline-fields .field{min-width:140px;flex:1}
.inline-fields .field.auto{flex:0 0 auto;min-width:0}

.switch{position:relative;width:44px;height:26px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface-2);cursor:pointer;padding:0;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .18s,background .18s}
.switch.on{background:var(--lime);border-color:var(--lime)}
.switch.on::after{transform:translateX(18px);background:var(--on-lime)}

.tabs{display:inline-flex;padding:4px;border-radius:999px;background:var(--surface);border:1px solid var(--line);gap:2px}
.tabs button{border:none;background:none;padding:8px 16px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:700;font-size:13px}
.tabs button.active{background:var(--lime);color:var(--on-lime)}
.subnav-wrap{margin:0 0 20px}
.subnav{flex-wrap:wrap}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px;border-radius:var(--r-sm);background:var(--warn-d);margin-bottom:16px;flex-wrap:wrap}
.banner.info{background:var(--violet-d)}

.list-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.list-item .li-main{min-width:0}
.list-item .li-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .li-sub{color:var(--muted);font-size:12px}
.li-right{display:flex;align-items:center;gap:10px;flex:0 0 auto}

.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.dot.done{opacity:.35}
.dot.moved{opacity:1;box-shadow:0 0 0 2px var(--surface, #19191E),0 0 0 3.5px var(--lavender)}
.k-alert{background:var(--bad);box-shadow:0 0 0 2px rgba(255,109,99,.25)}
.k-ingreso{background:var(--ok)}.k-renta{background:var(--lavender)}.k-servicio{background:var(--slate)}.k-deuda{background:var(--bad)}.k-viaje{background:var(--warn)}.k-meta{background:#E79BF2}.k-recurrente{background:var(--aqua)}

/* Flujo quincenal */
.flow-card{padding:22px}
.flow-card h3{font-size:16px}
.flow-ds{margin-top:14px;padding:16px 18px;border-radius:18px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--lime);color:var(--on-lime)}
.flow-ds .muted{color:rgba(23,24,15,.65)}
.flow-ds.bad{background:var(--bad);color:#2A0D0B}
.flow-ds.warn{background:var(--warn)}
.flow-ds .v{font-family:var(--display);font-size:26px;font-weight:500}
.flow-real{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.flow-real div{font-size:12px;color:var(--muted)}
.flow-real b{display:block;color:var(--text);font-size:14px}

/* Entidades (deudas, metas) */
.ent-card{padding:22px;display:flex;flex-direction:column;gap:12px;border-radius:var(--r-xl)}
.ent-card .ent-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ent-card h4{font-family:var(--display);font-weight:500;font-size:20px;letter-spacing:-.01em}
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.stat-grid div{font-size:12px;color:var(--muted)}
.stat-grid b{display:block;color:var(--text);font-size:14.5px;font-weight:700}
.liquidada{font-weight:800;color:var(--on-lime);padding:10px 12px;border-radius:14px;text-align:center;background:var(--lime)}

/* Calendario */
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-dow{font-size:12px;color:var(--muted-2);text-align:center;padding:4px 0;font-weight:600}
.cal-day{min-height:86px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);padding:7px 8px;cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:left;color:var(--text)}
.cal-day:hover{background:var(--surface-3)}
.cal-day.out{opacity:.35}
.cal-day.sel{border-color:var(--lavender);box-shadow:0 0 0 1px var(--lavender)}
.cal-day.today{background:var(--lime);color:var(--on-lime);border-color:var(--lime)}
.cal-day.today .camt,.cal-day.today .cal-ev{color:rgba(23,24,15,.7)}
.cal-day .dn{font-size:12.5px;font-weight:700}
.cal-day .dots{display:flex;flex-wrap:wrap;gap:3px}
.cal-day .camt{font-size:10.5px;color:var(--muted);margin-top:auto}
.cal-grid.tall .cal-day{min-height:118px}
.cal-ev{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.hbar{display:grid;grid-template-columns:140px 1fr 120px;gap:10px;align-items:center;padding:6px 0;font-size:13px}

/* Franja semanal: píldoras de fecha */
.wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin:0 0 22px}
.wday{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 4px 10px;border-radius:22px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;min-width:0}
.wday:hover{background:var(--surface-2)}
.wday.past{opacity:.55}
.wday .wd-name{font-size:11.5px;color:var(--muted);font-weight:600}
.wday .wd-num{font-family:var(--display);font-size:22px;font-weight:500;line-height:1.1}
.wday .dots{display:flex;gap:3px;min-height:8px;flex-wrap:wrap;justify-content:center}
.wday .wd-amt{font-size:11px;color:var(--muted);white-space:nowrap}
.wday.today{opacity:1;background:var(--lime);border-color:var(--lime);color:var(--on-lime);box-shadow:0 8px 28px rgba(211,243,91,.28)}
.wday.today .wd-name,.wday.today .wd-amt{color:rgba(23,24,15,.7)}
.wday.today .k-alert{box-shadow:0 0 0 2px var(--lime)}

/* Inicio: título, barra de herramientas y mosaicos */
.hero-title{font-family:var(--display);font-weight:400;font-size:clamp(40px,5.2vw,60px);line-height:1;letter-spacing:-.03em;margin:4px 0 12px}
.hero-note{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px}
.hero-note .link-btn{font-size:13.5px;text-decoration:underline;color:var(--text)}
.dash-sep{border:none;border-top:1px dashed var(--line-2);margin:18px 0}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.pill-input{display:inline-flex;align-items:center;gap:8px;padding:4px 6px 4px 4px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface)}
.pill-input .pi-ic{width:36px;height:36px;border-radius:50%;background:var(--lime);color:var(--on-lime);display:grid;place-items:center}
.pill-input input{border:none!important;background:transparent!important;min-height:36px!important;padding:4px 8px!important;width:auto;box-shadow:none!important}
.pill-input .btn{border:none}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tile{border-radius:var(--r-xl);padding:20px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;min-width:0;min-height:190px;color:var(--text);text-align:left}
.tile .t-ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--aqua);color:#123331;margin-bottom:auto}
.tile .t-title{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.15;letter-spacing:-.01em;margin-top:14px}
.tile .t-sub{font-size:12px;color:var(--muted)}
.tile .t-foot{display:flex;align-items:center;gap:8px 10px;font-size:12.5px;flex-wrap:wrap}
.tile .t-foot .bar{flex:1;height:5px}
.tile.lime{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.tile.lime .t-ic{background:var(--on-lime);color:var(--lime)}
.tile.lime .t-sub{color:rgba(23,24,15,.65)}
.tile.lime .bar{background:rgba(23,24,15,.16)}
.tile.lime .bar>span{background:var(--on-lime)}
.tile.lime.bad{background:var(--bad);border-color:var(--bad)}
.tile .t-big{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-family:var(--display);font-weight:400;font-size:clamp(28px,3vw,40px);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.tile .t-big small{font-size:20px;opacity:.55}
button.tile{cursor:pointer;font:inherit}
.tiles .today-tile{padding:0;gap:0}
@media (max-width:760px){.tiles .today-tile .today-head{padding:16px}.today-list{padding:0 16px 14px}}
.today-tile .today-head{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:8px;padding:20px;flex:1;min-height:inherit;border-radius:inherit}
.today-tile .today-head:focus-visible{outline:2px solid var(--lime);outline-offset:-2px}
.today-tile.open{grid-column:1/-1;min-height:0}
.today-tile.open .today-head{min-height:0}
.today-caret{margin-left:auto;display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.caret{width:7px;height:7px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(45deg) translateY(-2px);display:inline-block}
.caret.up{transform:rotate(-135deg) translateY(-2px)}
.today-list{padding:0 20px 18px;border-top:1px solid var(--line)}
.today-row{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;border-bottom:1px solid var(--line)}
.today-row .tr-main{flex:1;min-width:0;display:flex;flex-direction:column}
.today-row .tr-main b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.today-row .tr-main small{color:var(--muted);font-size:12px}
.today-row .tr-amt{font-size:14px;white-space:nowrap}
.sheet-violet{background:var(--violet);border-radius:var(--r-xl);padding:22px;color:#fff}
.sheet-violet .card-head h3{font-family:var(--display);font-weight:400;font-size:22px}
.sheet-violet .card-head .sub,.sheet-violet .muted{color:rgba(255,255,255,.72)}
.goal-row{background:rgba(255,255,255,.1);border-radius:18px;padding:14px 16px;margin-top:10px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center}
.goal-row .g-name{font-weight:700}
.goal-row .g-tags{display:flex;gap:6px;flex-wrap:wrap}
.goal-row .g-date{font-size:12px;color:rgba(255,255,255,.72)}
.ring{--p:0;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--lime) calc(var(--p)*1%),rgba(255,255,255,.18) 0);display:grid;place-items:center;grid-row:1/4;grid-column:2}
.ring::after{content:"";width:34px;height:34px;border-radius:50%;background:var(--violet)}
.goal-mini{padding:9px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.goal-mini:last-child{border-bottom:none}
.alert-card{margin-bottom:18px;background:var(--surface);border:1px solid rgba(255,195,77,.35)}
.alert-card h3{display:flex;align-items:center;gap:8px}
.alert-card h3 .ic{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);cursor:pointer;font-size:13px;font-weight:700}
.chip .ic{width:15px;height:15px}
.chip.active{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.week-picker{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.week-picker input{min-width:150px}
.week-picker .btn{flex:0 0 auto}
.week-label{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;padding:0 4px}
.period-bar{padding:14px 18px}
.pinput{max-width:120px;text-align:right;padding:6px 10px!important;min-height:36px!important;font-size:14px!important;margin-left:auto;display:block;border-radius:12px!important}
.bell-btn{position:relative}
.bell-count{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center}

/* Estimado vs registrado (detalle del día) */
.pr-row{padding:14px 0;border-bottom:1px solid var(--line)}
.pr-row:last-of-type{border-bottom:none}
.pr-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.pr-top .li-title{font-weight:700;white-space:normal}
.pr-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pr-grid>div{background:var(--surface-2);border-radius:14px;padding:8px 10px;min-width:0}
.pr-grid span{display:block;font-size:11.5px;color:var(--muted)}
.pr-grid b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-grid small{display:block;font-size:11.5px;font-weight:600;opacity:.9;white-space:nowrap}
.pr-diff.pos{background:var(--ok-d)}.pr-diff.pos b,.pr-diff.pos span,.pr-diff.pos small{color:var(--ok)}
.pr-diff.neg{background:var(--bad-d)}.pr-diff.neg b,.pr-diff.neg span,.pr-diff.neg small{color:var(--bad)}
.pr-diff.eq b{color:var(--text)}
.pr-total{margin-top:14px;padding:14px;border-radius:18px;border:1px dashed var(--line-2)}
.pr-total .li-title{margin-bottom:8px}
.pr-total .pr-grid>div{background:var(--surface-3)}

/* Bandeja de cargos */
.inbox-item{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.inbox-item:last-child{border-bottom:none}
.inbox-item .m-ic{width:42px;height:42px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-family:var(--display);font-weight:500;font-size:16px;color:var(--lavender)}
.inbox-item .m-name{font-weight:700}
.inbox-item .m-sub{font-size:12px;color:var(--muted)}
.inbox-item .m-amt{font-family:var(--display);font-size:20px;font-weight:500;text-align:right}
.suggest{display:inline-flex;align-items:center;gap:6px;font-size:12px;margin-top:4px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#121216;border:1px solid var(--line);border-radius:14px;padding:14px;white-space:pre;overflow:auto;max-height:340px;color:#DADAD2}
.steps-list{margin:0;padding-left:20px}.steps-list li{margin:8px 0}

/* Modal, confirmación, hoja de acciones */
.modal-back{position:fixed;inset:0;z-index:100;background:rgba(8,8,10,.66);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 24px;overflow-y:auto}
.modal{width:100%;max-width:620px;border-radius:var(--r-xl);background:var(--surface);border:1px solid var(--line-2);box-shadow:0 30px 70px rgba(0,0,0,.5)}
.modal.wide{max-width:800px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--line)}
.modal-head h3{font-family:var(--display);font-weight:500;font-size:21px}
.modal-body,.modal form{padding:20px 24px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;padding-top:18px;margin-top:6px;border-top:1px solid var(--line)}
.modal-body + .modal-actions{padding:14px 24px 22px;margin:0}
.form-preview:empty,.form-error:empty{display:none}
.form-preview{margin-top:14px;padding:12px 16px;border-radius:16px;background:var(--violet-d)}
.form-error{margin-top:12px;color:#FFD0CB;background:var(--bad-d);padding:10px 14px;border-radius:14px;font-size:13px}
#confirmRoot .modal-back{z-index:150;align-items:center}
#confirmRoot .modal{max-width:460px}
.confirm-msg{color:var(--muted);margin:0 0 6px;white-space:pre-line}
.choice{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px;border:1px solid var(--line-2);margin-top:8px;cursor:pointer}
.choice input{margin-top:3px;accent-color:var(--lime);width:18px;height:18px}
.choice:has(input:checked){border-color:var(--lime);background:rgba(211,243,91,.06)}
.sheet-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sheet-opt{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:20px;border:1px solid var(--line-2);background:var(--surface-2);cursor:pointer;color:var(--text);text-align:left}
.sheet-opt:hover{background:var(--surface-3)}
.sheet-opt .t-ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--aqua);color:#123331}
.sheet-opt b{font-size:14px}.sheet-opt span{font-size:12px;color:var(--muted)}
[hidden]{display:none!important}

/* Toasts */
#toastRoot{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:12px 14px 12px 18px;border-radius:999px;background:#F3F3EE;color:#17170F;box-shadow:0 14px 40px rgba(0,0,0,.4);font-size:13.5px;font-weight:600;max-width:420px;animation:tin .2s ease-out}
.toast.err{background:var(--bad);color:#2A0D0B}.toast.warn{background:var(--warn);color:#2A1E04}
.toast button{border:none;border-radius:999px;background:#17170F;color:var(--lime);padding:6px 12px;font-weight:800;cursor:pointer;font-size:12.5px}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Navegación inferior (móvil) */
.bottom-nav{display:none}
.fab-desk{position:fixed;right:28px;bottom:28px;z-index:35;width:60px;height:60px;border-radius:50%;border:none;background:var(--lime);color:var(--on-lime);display:grid;place-items:center;cursor:pointer;box-shadow:0 14px 34px rgba(211,243,91,.3)}
.fab-desk .ic{width:26px;height:26px}

/* Guía */
.guide p{margin:0 0 10px}
.guide ul{margin:0 0 12px;padding-left:20px}
.guide li{margin:6px 0}
.guide li::marker{color:var(--lime)}

/* ===== Responsive ===== */
@media (max-width:1180px){ .g4,.tiles{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:900px){
  .sidebar{transform:translateX(-100%);transition:transform .22s ease;width:290px;box-shadow:0 0 60px rgba(0,0,0,.5)}
  .sidebar.open{transform:none}
  .overlay{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.55)}
  .overlay.show{display:block}
  .main-wrap{margin-left:0}
  .topbar{padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top))}
  main{padding:14px 16px 130px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .top-ds small{display:none}
  .fab-desk{display:none}
  .bottom-nav{display:flex;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:45;align-items:center;gap:4px;padding:6px;border-radius:999px;background:rgba(48,48,56,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line-2);box-shadow:0 18px 40px rgba(0,0,0,.45)}
  .bn-item{width:52px;height:52px;border-radius:50%;border:none;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;position:relative}
  .bn-item.active{background:var(--surface-3);color:var(--text)}
  .bn-item .nav-count{position:absolute;top:4px;right:4px;margin:0;min-width:17px;height:17px;font-size:10px}
  .bn-fab{width:60px;height:60px;border-radius:50%;border:none;background:var(--lime);color:var(--on-lime);display:grid;place-items:center;cursor:pointer;margin:0 4px}
  .bn-fab .ic{width:26px;height:26px}
  #toastRoot{left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));align-items:center}
}
@media (max-width:560px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tiles{gap:10px}
  .tile{min-height:170px;padding:16px;border-radius:24px}
  .tile .t-title{font-size:18px}
  .tile .t-big{font-size:32px}
  .tile.lime{grid-column:1/-1;min-height:150px}
  .kpi{padding:14px 15px}
  .kpi-value{font-size:22px}
  .kpi.hero{grid-column:1/-1;order:-1}
  .kpi.hero .kpi-value{font-size:28px}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .card{padding:16px}
  .cal-day{min-height:56px;padding:5px 6px;border-radius:12px}
  .cal-day .camt{display:none}
  .cal-grid{gap:4px}
  .cal-grid.tall .cal-day{min-height:64px}
  .cal-ev{display:none}
  .hbar{grid-template-columns:96px 1fr 96px}
  .greet-text b{font-size:17px}
  .avatar{width:38px;height:38px}
  .top-ds{padding:7px 12px}
  .top-ds b{font-size:13.5px}
  .sim-badge{display:none}
  .modal-back{padding:0;align-items:flex-end}
  .modal{border-radius:28px 28px 0 0;max-height:94vh;overflow-y:auto}
  #confirmRoot .modal-back{align-items:flex-end}
  .flow-real{grid-template-columns:repeat(2,minmax(0,1fr))}
  .section-head .actions{width:100%}
  .wstrip{gap:4px;margin-bottom:16px}
  .wday{padding:9px 1px 8px;gap:2px}
  .wday .wd-num{font-size:17px}
  .wday .wd-name{font-size:10px}
  .wday .wd-amt{font-size:9.5px}
  .week-picker input{min-width:0;flex:1}
  .week-picker{width:100%}
  .toolbar .pill-input{flex:1}
  .inbox-item{grid-template-columns:auto 1fr;}
  .inbox-item .m-actions{grid-column:1/-1}
  h2{font-size:23px}
}
@media print{ .sidebar,.topbar,.actions,.bottom-nav,.fab-desk{display:none} .main-wrap{margin:0} }

/* =====================================================================
   VALIDATION & MIGRATION — integridad del esquema
   ===================================================================== */
const Schema = {
  COLLECTIONS: ['accounts', 'categories', 'movements', 'recurringExpenses', 'debts', 'goals', 'goalPayments', 'budgets', 'inbox', 'rules', 'cards', 'senders'],
  payCollection(obj) { return obj.version >= 3 ? 'goalPayments' : 'tripPayments'; },
  structure(obj) {
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return 'El archivo no contiene un objeto de datos válido.';
    if (typeof obj.version !== 'number') return 'Falta el número de versión del esquema.';
    if (obj.version > SCHEMA_VERSION) return 'El respaldo es de una versión más nueva de la aplicación (v' + obj.version + ').';
    if (!obj.settings || typeof obj.settings !== 'object') return 'Falta la sección "settings".';
    const payColl = this.payCollection(obj);
    for (const c of this.COLLECTIONS.concat(['tripPayments'])) if (obj[c] !== undefined && !Array.isArray(obj[c])) return 'La colección "' + c + '" no es una lista.';
    for (const c of ['accounts', 'movements', 'recurringExpenses', 'debts', 'goals', payColl]) {
      if (!Array.isArray(obj[c])) return 'Falta la colección "' + c + '".';
      const ids = new Set();
      for (const it of obj[c]) {
        if (!it || typeof it !== 'object' || typeof it.id !== 'string' || !it.id) return 'Registro sin identificador en "' + c + '".';
        if (ids.has(it.id)) return 'Identificador duplicado en "' + c + '": ' + it.id;
        ids.add(it.id);
      }
    }
    for (const m of obj.movements) {
      if (!isDate(m.date)) return 'Movimiento con fecha inválida (' + m.id + ').';
      if (!Number.isFinite(m.amount) || m.amount < 0) return 'Movimiento con monto inválido (' + m.id + ').';
      if (!TYPE_LABEL[m.type]) return 'Movimiento con tipo inválido (' + m.id + ').';
    }
    for (const r of obj.recurringExpenses) {
      if (!Number.isFinite(r.amount) || r.amount < 0) return 'Gasto recurrente con monto inválido (' + r.id + ').';
      if (!FREQ_LABEL[r.frequency]) return 'Gasto recurrente con periodicidad inválida (' + r.id + ').';
      if (!isDate(r.startDate)) return 'Gasto recurrente con fecha inicial inválida (' + r.id + ').';
    }
    for (const t of obj[payColl]) if (!isDate(t.dueDate) || !Number.isFinite(t.amount) || t.amount < 0) return 'Pago programado inválido (' + t.id + ').';
    for (const d of obj.debts) if (!Number.isFinite(d.baseBalance) || !Number.isFinite(d.initialBalance)) return 'Deuda con saldo inválido (' + d.id + ').';
    for (const g of obj.goals) if (!Number.isFinite(g.target) || g.target < 0) return 'Meta con monto inválido (' + g.id + ').';
    if (obj.version >= 3 && Array.isArray(obj.budgets)) for (const b of obj.budgets) if (!b || !b.category || !Number.isFinite(b.amount) || b.amount < 0 || !['semanal', 'mensual'].includes(b.period)) return 'Partida de presupuesto inválida.';

  },
  // Migraciones: MIGRATIONS[n] convierte un objeto de versión n a n+1.
  MIGRATIONS: {
    // v1 -> v2: elimina datos duplicados
    1: d => {
      const s = d.settings || (d.settings = {});
      d.goals = Array.isArray(d.goals) ? d.goals : [];
      d.movements = Array.isArray(d.movements) ? d.movements : [];
      let tg = d.goals.find(g => g.kind === 'trip');
      if (!tg) { tg = { id: 'goal_trip', kind: 'trip', name: 'Viaje · gastos durante el viaje', target: 15000, date: '2027-09-15', initialSaved: 0, perQuincena: null, notes: '' }; d.goals.unshift(tg); }

    // v2 -> v3: el viaje pasa a ser un tipo de meta; pagos programados para cualquier meta; partidas de presupuesto editables

      d.goals.forEach(g => {

      d.movements.forEach(m => { if (m.tripPaymentId) { m.goalPaymentId = m.tripPaymentId; delete m.tripPaymentId; } });

      const parts = [{ id: 'bud_alimentacion', category: 'Alimentación', amount: Number.isFinite(s.foodWeekly) ? s.foodWeekly : 2500, period: 'semanal', overrides: {}, notes: 'Comida del día a día' }];

        if (!b || !b.category || b.category === 'Alimentación') return;
        const amt = Number(b.monthly != null ? b.monthly : b.amount) || 0;
        const ex = parts.find(x => x.category === b.category);
        if (ex) ex.amount = r2(ex.amount + amt);
        else parts.push({ id: b.id || uid('bud'), category: b.category, amount: amt, period: 'mensual', overrides: {}, notes: b.notes || '' });
      });
      d.budgets = parts;

    },
    // v3 -> v4: bandeja de cargos del banco, reglas de categorización y tarjetas
    3: d => {
      ['inbox', 'rules', 'cards'].forEach(c => { if (!Array.isArray(d[c])) d[c] = []; });
      d.settings = d.settings || {};
      if (!d.settings.mail) d.settings.mail = { url: '', token: '', q: '', lastSync: 0, auto: true };

      d.version = 4;
      return d;
    },
    // v4 -> v5: estado de cada movimiento (pagado/cobrado real vs registrado pendiente)
    4: d => {
      const t = today();
      (d.movements || []).forEach(m => { if (m.status !== 'realizado' && m.status !== 'pendiente') m.status = m.date > t ? 'pendiente' : 'realizado'; });

  migrate(obj) {

  normalize(d) {

    d.settings.mail = Object.assign({}, def.settings.mail, d.settings.mail || {});
    this.COLLECTIONS.forEach(c => { if (!Array.isArray(d[c])) d[c] = []; });
    if (!d.meta) d.meta = def.meta;
    if (!d.categories.length) d.categories = def.categories;
    d.categories = d.categories.map(c => typeof c === 'string' ? { id: uid('cat'), name: c } : c);
    ['Metas y eventos', 'Viaje', 'Alimentación'].forEach(n => { if (!d.categories.some(c => c.name === n)) d.categories.push({ id: uid('cat'), name: n }); });
    if (!d.meta.setup || typeof d.meta.setup !== 'object') d.meta.setup = {};
    d.goals.forEach(g => { if (!GOAL_TYPE[g.kind]) g.kind = 'ahorro'; });
    d.goalPayments.forEach(p => { if (p.prepaid === undefined) p.prepaid = null; });
    d.budgets.forEach(b => { if (!b.overrides || typeof b.overrides !== 'object') b.overrides = {}; if (!b.period) b.period = 'mensual'; });
    d.movements.forEach(m => { if (m.status !== 'realizado' && m.status !== 'pendiente') m.status = m.date > today() ? 'pendiente' : 'realizado'; });
    d.recurringExpenses.forEach(r => { if (typeof r.active !== 'boolean') r.active = true; if (typeof r.reserve !== 'boolean') r.reserve = false; if (!Array.isArray(r.skips)) r.skips = []; });

    return d;
  }
};

/* =====================================================================
   STORAGE — una sola clave versionada en localStorage
   ===================================================================== */
const Store = {
  data: null,
  persistent: true,
  lastSaved: null,
  load() {
    let raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); }
    catch (e) { this.persistent = false; }
    if (!raw) { this.data = defaultData(); this.save(); return 'new'; }
    try {
      const obj = JSON.parse(raw);
      const err = Schema.structure(obj);
      if (err) throw new Error(err);
      const old = obj.version;
      this.data = Schema.migrate(obj);
      if (old < SCHEMA_VERSION) {
        try { localStorage.setItem(STORAGE_KEY + '_respaldo_v' + old, raw); } catch (e2) { /* sin espacio */ }
        this.save();
        return 'migrated';
      }
      return 'loaded';
    } catch (e) {
      console.error('Datos corruptos', e);
      try { localStorage.setItem(STORAGE_KEY + '_respaldo_corrupto', raw); } catch (e2) { /* sin espacio */ }
      this.data = defaultData();
      this.save();
      return 'corrupt';
    }
  },
  save() {
    if (!this.data) return false;
    this.data.meta.updatedAt = new Date().toISOString();
    if (!this.persistent) return false;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data));
      this.lastSaved = new Date();
      return true;
    } catch (e) {
      console.error(e);
      Toast.show('No se pudo guardar en este navegador (almacenamiento lleno o bloqueado). Exporta un respaldo.', 'err');
      return false;
    }
  },
  replace(obj) { this.data = obj; return this.save(); },
  reset() { this.data = defaultData(); return this.save(); }
};
const D = () => Store.data;

/* =====================================================================
   CALCULATIONS — motor financiero
   ===================================================================== */
const Calc = {
  /* --- Quincenas --- */
  paydaysBetween(a, b) {
    const s = D().settings, res = [];
    if (!isDate(a) || !isDate(b) || a > b) return res;
    const pa = parts(a), pb = parts(b);
    for (let i = pa.y * 12 + pa.m; i <= pb.y * 12 + pb.m; i++) {
      const y = Math.floor(i / 12), m = i % 12;
      const d1 = ymd(y, m, s.q1Day), d2 = ymd(y, m, s.q2Day);
      if (d1 >= a && d1 <= b) res.push({ date: d1, q: 1, amount: Number(s.q1Amount) || 0 });
      if (d2 >= a && d2 <= b && d2 !== d1) res.push({ date: d2, q: 2, amount: Number(s.q2Amount) || 0 });
    }
    return res.sort((x, y) => x.date < y.date ? -1 : 1);
  },
  periodOf(date) {
    const prev = this.paydaysBetween(addDays(date, -45), date);
    const last = prev[prev.length - 1];
    const next = this.paydaysBetween(addDays(date, 1), addDays(date, 45))[0];
    return { start: last.date, end: addDays(next.date, -1), q: last.q, amount: last.amount, nextPayday: next.date, nextQ: next.q, nextAmount: next.amount };
  },
  // Cobro de nómina: a qué quincena corresponde (permite cobros adelantados o atrasados)
  payQOf(m) { return isDate(m.forPayday) ? m.forPayday : this.periodOf(m.date).start; },
  nearestPayday(date) {
    const ps = this.paydaysBetween(addDays(date, -20), addDays(date, 20));
    let best = null;
    ps.forEach(p => { const dd = Math.abs(diffDays(date, p.date)); if (!best || dd < best.dd || (dd === best.dd && p.date > best.p.date)) best = { p, dd }; });
    return best ? best.p : this.paydaysBetween(this.periodOf(date).start, this.periodOf(date).start)[0];
  },
  quincenaFor(payday, exceptId) { return D().movements.find(m => m.incomeKind === 'quincena' && m.id !== exceptId && this.payQOf(m) === payday) || null; },
  // Desfase entre lo programado y la fecha real (negativo = adelantado)
  shiftLabel(planned, real) { const n = diffDays(planned, real); if (!n) return ''; const k = Math.abs(n); return (n < 0 ? 'Adelantado ' : 'Atrasado ') + k + (k === 1 ? ' día' : ' días') + ' · programado ' + fmtDateS(planned); },
  planningStart() {
    const s = D().settings, per = this.periodOf(today());
    if (per.start >= s.startDate) return per.start;
    const p = this.paydaysBetween(s.startDate, addDays(s.startDate, 45))[0];
    return p ? p.date : per.start;
  },
  expectedMonthly() { const s = D().settings; return r2((Number(s.q1Amount) || 0) + (Number(s.q2Amount) || 0)); },

  /* --- Recurrentes --- */
  occurrences(r, a, b, ignoreStart) {
    if (!r || !isDate(r.startDate) || !isDate(a) || !isDate(b)) return [];
    let lo = a, hi = b;
    if (!ignoreStart && r.startDate > lo) lo = r.startDate;
    if (r.endDate && isDate(r.endDate) && r.endDate < hi) hi = r.endDate;
    if (lo > hi) return [];
    const out = [];
    const iv = MONTH_FREQ[r.frequency];
    const pl = parts(lo), ph = parts(hi);
    if (iv) {
      const st = parts(r.startDate), anchor = st.y * 12 + st.m;
      for (let i = pl.y * 12 + pl.m; i <= ph.y * 12 + ph.m; i++) {
        if (((i - anchor) % iv + iv) % iv !== 0) continue;
        const ds = ymd(Math.floor(i / 12), i % 12, r.payDay);
        if (ds >= lo && ds <= hi) out.push(ds);
      }
    } else if (r.frequency === 'quincenal') {
      const d1 = r.payDay, d2 = d1 + 15 > 30 ? d1 - 15 : d1 + 15;
      for (let i = pl.y * 12 + pl.m; i <= ph.y * 12 + ph.m; i++) {
        const y = Math.floor(i / 12), m = i % 12;
        [d1, d2].forEach(d => { const ds = ymd(y, m, d); if (ds >= lo && ds <= hi) out.push(ds); });
      }
    } else {
      const step = r.frequency === 'semanal' ? 7 : Math.max(1, Math.round(r.customDays || 30));
      const base = toDn(r.startDate), L = toDn(lo), H = toDn(hi);
      for (let n = base + Math.ceil((L - base) / step) * step; n <= H; n += step) out.push(fromDn(n));
    }
    const skips = r.skips || [];
    return Array.from(new Set(out)).filter(x => !skips.includes(x)).sort();
  },
  monthlyEquivalent(r) {
    const a = Number(r.amount) || 0;
    if (MONTH_FREQ[r.frequency]) return a / MONTH_FREQ[r.frequency];
    if (r.frequency === 'quincenal') return a * 2;
    if (r.frequency === 'semanal') return a * 52 / 12;
    return a * (365 / Math.max(1, r.customDays || 30)) / 12;
  },
  isReservable(r) { return !!MONTH_FREQ[r.frequency]; },
  occPayment(r, date) { return D().movements.find(m => m.recurringId === r.id && m.occDate === date) || null; },
  isOccPaid(r, date) { return !!this.occPayment(r, date); },
  prevOccurrence(r, D0) {
    const prev = this.occurrences(r, addDays(D0, -800), addDays(D0, -1), true);
    if (prev.length) return prev[prev.length - 1];
    const iv = MONTH_FREQ[r.frequency] || 1;
    return addDays(D0, -30 * iv);
  },
  apartadoForPeriod(r, S) {
    if (!r.active || !r.reserve || !this.isReservable(r)) return 0;
    const occ = this.occurrences(r, S, addDays(S, 800));
    if (!occ.length) return 0;
    const due = occ[0], P = this.prevOccurrence(r, due);
    const n = this.paydaysBetween(addDays(P, 1), due).length;
    return n ? r2(r.amount / n) : r.amount;
  },
  reserveInfo(r, t) {
    if (!r.active || !r.reserve || !this.isReservable(r)) return null;
    const occ = this.occurrences(r, t, addDays(t, 800));
    const due = occ.find(d => !this.isOccPaid(r, d));
    if (!due) return null;
    const P = this.prevOccurrence(r, due);
    const pays = this.paydaysBetween(addDays(P, 1), due);
    const n = pays.length;
    if (!n) return { nextDue: due, n: 0, k: 0, perQ: r.amount, accumulated: 0 };
    const k = pays.filter(p => p.date <= t).length;
    return { nextDue: due, n, k, perQ: r2(r.amount / n), accumulated: r2(r.amount * k / n), funding: pays.map(p => p.date) };
  },

  /* --- Movimientos y cuentas --- */
  movementsIn(a, b, pred) { return D().movements.filter(m => m.date >= a && m.date <= b && (!pred || pred(m))); },
  // Efecto de un movimiento sobre cada cuenta (las compras con tarjeta no tocan cuentas)
  effects(m) {
    if (m.type === 'gasto' && m.creditDebtId) return [];
    // Disposición de efectivo con tarjeta: no sale de cuentas, entra a Efectivo (la deuda sube)
    if (m.type === 'transferencia' && m.creditDebtId) return [[m.toAccount, m.amount]];
    switch (m.type) {
      case 'ingreso': return [[m.account, m.amount]];
      case 'gasto': case 'pago_deuda': return [[m.account, -m.amount]];
      case 'ahorro': case 'transferencia': return [[m.account, -m.amount], [m.toAccount, m.amount]];
    }
    return [];
  },
  // Pagado/cobrado (real) vs registrado pendiente: solo lo real mueve los saldos
  isReal(m) { return m.status !== 'pendiente'; },
  defaultStatus(date) { return date <= today() ? 'realizado' : 'pendiente'; },
  // Efecto neto de un movimiento sobre las cuentas líquidas (+ entra, − sale)
  liquidEffect(m) { const ids = this.liquidIds(); return sum(this.effects(m).filter(([id]) => ids.includes(id)), x => x[1]); },
  pendingMovs(a, b) { return D().movements.filter(m => !this.isReal(m) && (!a || m.date >= a) && (!b || m.date <= b)); },
  pendingFlows(a, b) {
    let inflow = 0, outflow = 0;
    this.pendingMovs(a, b).forEach(m => { const v = this.liquidEffect(m); if (v > 0) inflow += v; else outflow -= v; });
    return { inflow: r2(inflow), outflow: r2(outflow), net: r2(inflow - outflow) };
  },
  balances(asOf) {
    // Sin fecha = saldo real continuo y total (todo lo pagado/cobrado, sin cortes). Con fecha = saldo real a ese día.
    const d = D(), b = {}, lim = asOf || '9999-12-31';
    d.accounts.forEach(a => { b[a.id] = Number(a.initialBalance) || 0; });
    d.movements.forEach(m => {
      if (m.date > lim || !this.isReal(m)) return;
      this.effects(m).forEach(([id, v]) => { if (id) b[id] = (b[id] || 0) + v; });
    });
    Object.keys(b).forEach(k => { b[k] = r2(b[k]); });
    return b;
  },
  liquidIds() { return D().accounts.filter(a => a.type === 'liquida').map(a => a.id); },
  liquid(asOf) { const b = this.balances(asOf); return sum(this.liquidIds(), id => b[id]); },
  // Resumen de un periodo: ingresos, egresos, ahorro, saldo líquido inicial y final
  periodSummary(a, b) {
    const mv = this.movementsIn(a, b), liq = this.liquidIds();
    const inc = mv.filter(m => m.type === 'ingreso');
    const res = {
      start: a, end: b,
      income: sum(inc, m => m.amount),
      ordinary: sum(inc, m => m.incomeKind === 'quincena' ? m.ordinary : (m.incomeKind === 'extra' ? 0 : m.amount)),
      extra: sum(inc, m => m.extraordinary || 0),
      spent: sum(mv.filter(m => m.type === 'gasto'), m => m.amount),
      cardSpent: sum(mv.filter(m => m.type === 'gasto' && m.creditDebtId), m => m.amount),
      debtPaid: sum(mv.filter(m => m.type === 'pago_deuda'), m => m.amount),
      saved: sum(mv.filter(m => m.type === 'ahorro'), m => m.amount),
      count: mv.length,
      openLiquid: this.liquid(addDays(a, -1)),
      closeLiquid: this.liquid(b)
    };
    // Flujo de efectivo real del periodo y lo registrado pendiente
    let rin = 0, rout = 0;
    mv.filter(m => this.isReal(m)).forEach(m => { const v = this.liquidEffect(m); if (v > 0) rin += v; else rout -= v; });
    res.realIn = r2(rin); res.realOut = r2(rout);
    const pf = this.pendingFlows(a, b); res.pendIn = pf.inflow; res.pendOut = pf.outflow;
    res.net = r2(res.income - (res.spent - res.cardSpent) - res.debtPaid - res.saved);
    return res;
  },
  accountFlows(a, b) {
    const d = D(), open = this.balances(addDays(a, -1)), close = this.balances(b), flow = {};
    d.accounts.forEach(x => { flow[x.id] = { inflow: 0, outflow: 0 }; });
    this.movementsIn(a, b).forEach(m => this.effects(m).forEach(([id, v]) => { if (!flow[id]) return; if (v > 0) flow[id].inflow += v; else flow[id].outflow -= v; }));
    return d.accounts.map(x => ({ acc: x, open: open[x.id] || 0, inflow: r2(flow[x.id].inflow), outflow: r2(flow[x.id].outflow), close: close[x.id] || 0 }));
  },

  /* --- Deudas --- */
  debtPaid(id, a, b, all) { return sum(D().movements.filter(m => m.type === 'pago_deuda' && m.debtId === id && (all || this.isReal(m)) && (!a || m.date >= a) && (!b || m.date <= b)), m => m.amount); },
  debtCharges(id) { return sum(D().movements.filter(m => (m.type === 'gasto' || m.type === 'transferencia') && m.creditDebtId === id), m => m.amount); },
  debtCurrent(db) { return r2((Number(db.baseBalance) || 0) - this.debtPaid(db.id) + this.debtCharges(db.id)); },
  seriesPlan(balAtFirst, first, S, due, minPay) {
    let bal = balAtFirst;
    for (const p of this.paydaysBetween(first, S)) {
      if (bal <= 0.004) return 0;
      let plan;
      if (due && isDate(due)) {
        const n = due >= p.date ? Math.max(1, this.paydaysBetween(p.date, due).length) : 1;
        plan = Math.min(bal, Math.max(minPay || 0, bal / n));
      } else plan = Math.min(bal, minPay || 0);
      if (p.date === S) return r2(plan);
      bal -= plan;
    }
    return 0;
  },
  debtPlan(db, S) {
    const cur = this.debtCurrent(db);
    const first = this.planningStart();
    const from = S < first ? S : first;
    const bal = cur + this.debtPaid(db.id, from, null);
    return this.seriesPlan(bal, from, S, db.dueDate, db.minPayment);
  },
  debtStats(db) {
    const cur = this.debtCurrent(db), init = Number(db.initialBalance) || 0, charges = this.debtCharges(db.id), total = r2(init + charges);
    const paid = r2(Math.max(0, total - cur));
    return { current: cur, initial: init, charges, total, paid, pct: total > 0 ? clamp(paid / total, 0, 1) : (cur <= 0 ? 1 : 0), settled: cur <= 0.004 };
  },

  /* --- Metas (cualquier tipo, incluido viaje) --- */
  goal(id) { return D().goals.find(g => g.id === id); },
  goalType(g) { return GOAL_TYPE[g && g.kind] || GOAL_TYPE.otro; },
  goalPayCategory(g) { return g && g.kind === 'viaje' ? 'Viaje' : 'Metas y eventos'; },
  goalSaveCategory(g) { return g && g.kind === 'viaje' ? 'Viaje' : 'Ahorro'; },
  goalSaved(g, a, b, all) { return r2((a || b ? 0 : Number(g.initialSaved) || 0) + sum(D().movements.filter(m => m.type === 'ahorro' && m.goalId === g.id && (all || this.isReal(m)) && (!a || m.date >= a) && (!b || m.date <= b)), m => m.amount)); },
  goalPlan(g, S) {
    const remainingNow = Math.max(0, (Number(g.target) || 0) - this.goalSaved(g));
    const first = this.planningStart();
    const from = S < first ? S : first;
    const bal = remainingNow + this.goalSaved(g, from, null);
    if (g.perQuincena > 0) {
      let b = bal;
      for (const p of this.paydaysBetween(from, S)) { const pl = Math.min(b, g.perQuincena); if (p.date === S) return r2(Math.max(0, pl)); b -= pl; }
      return 0;
    }
    if (!isDate(g.date)) return 0;
    return this.seriesPlan(bal, from, S, g.date, 0);
  },
  goalStats(g) {
    const saved = this.goalSaved(g), target = Number(g.target) || 0;
    const left = r2(Math.max(0, target - saved));
    const t = today();
    const qLeft = isDate(g.date) && g.date >= t ? this.paydaysBetween(t, g.date).length : 0;
    return { saved, target, left, pct: target > 0 ? clamp(saved / target, 0, 1) : 0, qLeft, suggested: g.perQuincena > 0 ? g.perQuincena : (qLeft ? r2(left / qLeft) : left) };
  },
  // Un pago programado está pagado si tiene un movimiento vinculado (o si se pagó antes de usar la app). No hay un "estado" aparte.
  payInfo(p) {
    const m = D().movements.find(x => x.goalPaymentId === p.id);
    if (m) return { date: m.date, amount: m.amount, mov: m };
    if (p.prepaid && isDate(p.prepaid.date)) return { date: p.prepaid.date, amount: Number(p.prepaid.amount) || p.amount, prepaid: true };
    return null;
  },
  isPayDone(p) { return !!this.payInfo(p); },
  goalPays(g) { return D().goalPayments.filter(p => p.goalId === g.id); },
  payStats(g) {
    const ps = this.goalPays(g).slice().sort((a, b) => a.dueDate < b.dueDate ? -1 : 1).map(p => ({ p, info: this.payInfo(p) }));
    const total = sum(ps, x => x.p.amount);
    const paidL = ps.filter(x => x.info), pendL = ps.filter(x => !x.info);
    return { list: ps, total, paid: sum(paidL, x => x.info.amount), pending: sum(pendL, x => x.p.amount), next: pendL.length ? pendL[0].p : null, countPaid: paidL.length, count: ps.length, pct: total > 0 ? clamp(sum(paidL, x => x.p.amount) / total, 0, 1) : 0 };
  },
  payLabel(p) { const g = this.goal(p.goalId); return (g && g.kind === 'viaje' ? 'Pago viaje' : 'Pago') + ' · ' + (g ? g.name : 'meta'); },

  /* --- Partidas de presupuesto --- */
  partida(cat) { return D().budgets.find(b => b.category === cat); },
  periodKey(p, date) { return p.period === 'semanal' ? this.weekStartOf(date) : monthStart(date); },
  partidaAmountFor(p, key) { const o = p.overrides && p.overrides[key]; return Number.isFinite(o) ? o : (Number(p.amount) || 0); },
  // Presupuesto de una partida en cualquier rango: prorratea semanas o meses (respeta ajustes por periodo)
  partidaRange(p, a, b) {
    let t = 0;
    if (p.period === 'semanal') {
      for (let ws = this.weekStartOf(a); ws <= b; ws = addDays(ws, 7)) {
        const we = addDays(ws, 6), lo = ws < a ? a : ws, hi = we > b ? b : we, days = diffDays(lo, hi) + 1;
        if (days > 0) t += this.partidaAmountFor(p, ws) * days / 7;
      }
    } else {
      for (let ms = monthStart(a); ms <= b; ms = addMonthsStart(ms, 1)) {
        const me = monthEnd(ms), lo = ms < a ? a : ms, hi = me > b ? b : me, days = diffDays(lo, hi) + 1;
        if (days > 0) t += this.partidaAmountFor(p, ms) * days / (diffDays(ms, me) + 1);
      }
    }
    return r2(t);
  },
  catBudget(cat, a, b) { const p = this.partida(cat); return p ? this.partidaRange(p, a, b) : 0; },
  foodWeeklyBase() { const p = this.partida('Alimentación'); return p ? (p.period === 'semanal' ? p.amount : r2(p.amount * 12 / 52)) : 0; },

  /* --- Flujo quincenal --- */
  flowFor(S) {
    const d = D();
    const per = this.periodOf(S), E = per.end, days = diffDays(S, E) + 1;
    const apart = [], services = [], others = [];
    d.recurringExpenses.filter(r => r.active).forEach(r => {
      if (r.reserve && this.isReservable(r)) {
        const a = this.apartadoForPeriod(r, S);
        if (a > 0) apart.push({ name: r.name, amount: a, id: r.id });
      } else {
        this.occurrences(r, S, E).forEach(dt => (r.category === 'Servicios' ? services : others).push({ name: r.name, amount: r.amount, date: dt }));
      }
    });
    const food = this.catBudget('Alimentación', S, E);
    const partidas = d.budgets.filter(p => p.category !== 'Alimentación').map(p => ({ name: p.category, amount: this.partidaRange(p, S, E) })).filter(x => x.amount > 0);
    const goalPays = d.goalPayments.filter(p => p.dueDate >= S && p.dueDate <= E).map(p => ({ name: this.payLabel(p) + ' (' + fmtDateS(p.dueDate) + ')', amount: p.amount, paid: this.isPayDone(p) }));
    const goalSaves = d.goals.map(g => ({ name: 'Ahorro · ' + g.name, amount: this.goalPlan(g, S) })).filter(x => x.amount > 0);
    const debts = d.debts.map(db => ({ name: db.name, amount: this.debtPlan(db, S) })).filter(x => x.amount > 0);
    const tot = {
      apart: sum(apart, x => x.amount), food, partidas: sum(partidas, x => x.amount), services: sum(services, x => x.amount), others: sum(others, x => x.amount),
      goals: r2(sum(goalPays, x => x.amount) + sum(goalSaves, x => x.amount)), debts: sum(debts, x => x.amount)
    };
    const total = r2(tot.apart + tot.food + tot.partidas + tot.services + tot.others + tot.goals + tot.debts);
    const inc = this.movementsIn(S, E, m => m.type === 'ingreso');
    const qm = this.quincenaFor(S);
    return {
      start: S, end: E, q: per.q, days, income: per.amount,
      apart, services, others, partidas, goalPays, goalSaves, debts, food, tot, total, safe: r2(per.amount - total),
      real: {
        income: sum(inc, m => m.amount), quincena: qm ? qm.amount : 0, extra: sum(inc, m => m.extraordinary || 0),
        spent: sum(this.movementsIn(S, E, m => m.type === 'gasto' || m.type === 'pago_deuda'), m => m.amount),
        saved: sum(this.movementsIn(S, E, m => m.type === 'ahorro'), m => m.amount),
        received: !!qm
      }
    };
  },

  /* --- DISPONIBLE SEGURO --- */
  safe(t) {
    t = t || today();
    const d = D(), s = d.settings, per = this.periodOf(t), winEnd = per.end;
    const daysLeft = diffDays(t, winEnd) + 1;
    const liquid = this.liquid();
    const commitments = [], apartados = [], savings = [];
    d.recurringExpenses.filter(r => r.active).forEach(r => {
      this.occurrences(r, s.startDate, winEnd).forEach(dt => {
        if (!this.isOccPaid(r, dt)) commitments.push({ kind: 'recurrente', ref: r.id, name: r.name, date: dt, amount: r.amount, overdue: dt < t });
      });
      const info = this.reserveInfo(r, t);
      if (info && info.nextDue > winEnd && info.accumulated > 0) apartados.push({ name: r.name, amount: info.accumulated, date: info.nextDue, detail: info.k + ' de ' + info.n + ' quincenas' });
    });
    d.goalPayments.forEach(p => {
      if (!this.isPayDone(p) && p.dueDate <= winEnd && p.dueDate >= s.startDate) commitments.push({ kind: 'meta', ref: p.id, name: this.payLabel(p), date: p.dueDate, amount: p.amount, overdue: p.dueDate < t });
    });
    if (per.start >= s.startDate) {
      d.debts.forEach(db => {
        const rem = r2(this.debtPlan(db, per.start) - this.debtPaid(db.id, per.start, winEnd, true));
        if (rem > 0.004) commitments.push({ kind: 'deuda', ref: db.id, name: 'Abono ' + db.name, date: winEnd, amount: rem });
      });
      d.goals.forEach(g => {
        const rem = r2(this.goalPlan(g, per.start) - this.goalSaved(g, per.start, winEnd, true));
        if (rem > 0.004) savings.push({ name: g.name, amount: rem });
      });
    }
    // Consumo variable restante (partidas) hasta el próximo ingreso
    d.budgets.forEach(p => {
      const spentToday = sum(this.movementsIn(t, t, m => m.type === 'gasto' && m.category === p.category), m => m.amount);
      const rem = r2(Math.max(0, this.partidaRange(p, t, winEnd) - spentToday));
      if (rem > 0) commitments.push({ kind: 'partida', name: p.category + ' restante (' + daysLeft + (daysLeft === 1 ? ' día' : ' días') + ')', date: winEnd, amount: rem });
    });
    // Registrado pendiente de pagar (aún no sale dinero real): se aparta hasta el próximo ingreso
    this.pendingMovs(null, winEnd).forEach(m => {
      const v = this.liquidEffect(m);
      if (v < -0.004) commitments.push({ kind: 'registrado', ref: m.id, name: (m.description || m.category || 'Movimiento') + ' · registrado por pagar', date: m.date, amount: r2(-v), overdue: m.date < t });
    });
    const pend = this.pendingFlows();
    commitments.sort((a, b) => a.date < b.date ? -1 : 1);
    const totalCommit = sum(commitments, x => x.amount), totalApart = sum(apartados, x => x.amount), totalSave = sum(savings, x => x.amount);
    const safe = r2(liquid - totalCommit - totalApart - totalSave);
    return { today: t, period: per, nextPayday: per.nextPayday, daysLeft, liquid, pendIn: pend.inflow, pendOut: pend.outflow, projected: r2(liquid + pend.net), commitments, apartados, savings, totalCommit, totalApart, totalSave, safe, perDay: r2(safe / Math.max(1, daysLeft)) };
  },
  safeTone(v) { if (v < 0) return 'bad'; const q = Number(D().settings.q1Amount) || 1; return v < q * 0.05 ? 'warn' : 'ok'; },

  /* --- Semana --- */
  weekStartOf(date) { const ws = Number(D().settings.weekStart) || 0; return addDays(date, -((dow(date) - ws + 7) % 7)); },
  weekFood(ws) {
    const we = addDays(ws, 6), t = today();
    const budget = this.catBudget('Alimentación', ws, we);
    const items = this.movementsIn(ws, we, m => m.type === 'gasto' && m.category === 'Alimentación').sort((a, b) => a.date < b.date ? 1 : -1);
    const spent = sum(items, m => m.amount);
    const daysLeft = t < ws ? 7 : (t > we ? 0 : diffDays(t, we) + 1);
    const p = budget > 0 ? spent / budget : (spent > 0 ? Infinity : 0);
    return { start: ws, end: we, budget, spent, available: r2(budget - spent), pct: p, daysLeft, items, status: this.status(budget > 0 ? p : (spent > 0 ? Infinity : 0)), otherSpent: sum(this.movementsIn(ws, we, m => m.type === 'gasto' && m.category !== 'Alimentación'), m => m.amount) };
  },
  status(p) {
    if (p === null || p === undefined) return { key: 'none', label: 'Sin presupuesto', badge: 'b-muted', tone: 'slate' };
    if (p > 1) return { key: 'excedido', label: 'Excedido', badge: 'b-bad', tone: 'bad' };
    if (p > 0.9) return { key: 'riesgo', label: 'Riesgo', badge: 'b-risk', tone: 'risk' };
    if (p > 0.7) return { key: 'atencion', label: 'Atención', badge: 'b-warn', tone: 'warn' };
    return { key: 'normal', label: 'Normal', badge: 'b-ok', tone: 'ok' };
  },

  /* --- Presupuesto vs real --- */
  budget(a, b) {
    const d = D(), map = new Map();
    const get = cat => { if (!map.has(cat)) map.set(cat, { category: cat, planned: 0, partida: 0, real: 0, sources: [], p: null }); return map.get(cat); };
    d.budgets.forEach(p => { const x = get(p.category); x.p = p; x.partida = this.partidaRange(p, a, b); });
    d.recurringExpenses.filter(r => r.active).forEach(r => {
      const n = this.occurrences(r, a, b).length;
      if (n) { const x = get(r.category); x.planned += n * r.amount; x.sources.push(r.name + (n > 1 ? ' ×' + n : '')); }
    });
    d.goalPayments.forEach(p => { if (p.dueDate >= a && p.dueDate <= b) { const g = this.goal(p.goalId), x = get(this.goalPayCategory(g)); x.planned += p.amount; if (g && !x.sources.includes(g.name)) x.sources.push(g.name); } });
    this.movementsIn(a, b, m => m.type === 'gasto').forEach(m => { get(m.category).real += m.amount; });
    const rows = Array.from(map.values()).map(r => {
      r.planned = r2(r.planned); r.partida = r2(r.partida); r.real = r2(r.real);
      r.budget = r2(r.planned + r.partida);
      const dev = r2(r.budget - r.real);
      const p = r.budget > 0 ? r.real / r.budget : (r.real > 0 ? Infinity : null);
      return Object.assign(r, { dev, devPct: r.budget > 0 ? dev / r.budget : null, pct: p, status: r.budget > 0 ? this.status(p) : (r.real > 0 ? { key: 'sinpres', label: 'Sin presupuesto', badge: 'b-risk', tone: 'risk' } : this.status(null)) });
    }).filter(r => r.budget > 0 || r.real > 0 || r.p).sort((x, y) => (y.budget - x.budget) || (y.real - x.real));
    const tb = sum(rows, r => r.budget), tr = sum(rows, r => r.real);
    return { rows, budget: tb, real: tr, dev: r2(tb - tr), pct: tb > 0 ? tr / tb : null, status: this.status(tb > 0 ? tr / tb : null) };
  },
  // Programado vs real de cobros y pagos de un periodo (análisis por evento)
  planVsReal(a, b) {
    const d = D(), t = today(), rows = [];
    const st = (done, date) => done ? { label: 'Registrado', badge: 'b-ok' } : (date < t ? { label: 'Sin registrar', badge: 'b-bad' } : (date === t ? { label: 'Hoy', badge: 'b-warn' } : { label: 'Pendiente', badge: 'b-muted' }));
    this.paydaysBetween(a, b).forEach(p => {
      const m = this.quincenaFor(p.date);
      rows.push({ kind: 'cobro', date: p.date, realDate: m ? m.date : null, name: 'Nómina quincena ' + p.q, planned: p.amount, real: m ? m.amount : null, dev: m ? r2(m.amount - p.amount) : null, status: st(!!m, p.date), action: m ? null : 'newIncomeQ', data: { date: p.date } });
    });
    d.recurringExpenses.filter(r => r.active).forEach(r => this.occurrences(r, a, b).forEach(dt => {
      const m = this.occPayment(r, dt);
      rows.push({ kind: 'pago', date: dt, realDate: m ? m.date : null, name: r.name, planned: r.amount, real: m ? m.amount : null, dev: m ? r2(r.amount - m.amount) : null, status: st(!!m, dt), action: m ? null : 'payRecurring', data: { id: r.id, date: dt } });
    }));
    d.goalPayments.forEach(p => {
      if (p.dueDate < a || p.dueDate > b) return;
      const i = this.payInfo(p);
      rows.push({ kind: 'pago', date: p.dueDate, realDate: i ? i.date : null, name: this.payLabel(p), planned: p.amount, real: i ? i.amount : null, dev: i ? r2(p.amount - i.amount) : null, status: st(!!i, p.dueDate), action: i ? null : 'payGoalPay', data: { id: p.id } });
    });
